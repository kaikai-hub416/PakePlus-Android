/* ---------- 拖拽引擎（鼠标 / 触摸 / 触控笔 统一） ---------- */
let DRAG=null,DROPS=[];
function clearDrops(){DROPS=[];DRAG=null;}
function addDrop(el,match){DROPS.push({el,match});}
function dropAt(x,y){
  for(let i=DROPS.length-1;i>=0;i--){
    const d=DROPS[i];
    if(!d.el||!d.el.isConnected)continue;
    const r=d.el.getBoundingClientRect(),pad=14;
    if(x>=r.left-pad&&x<=r.right+pad&&y>=r.top-pad&&y<=r.bottom+pad)return d;
  }
  return null;
}
function dragify(el,cfg){
  cfg=cfg||{};
  el.classList.add('fm-drag');
  el.style.touchAction='none';
  el.addEventListener('pointerdown',e=>{
    if(el.dataset.lock==='1')return;
    // 兜底：上一次拖拽异常未结束时强制清理，避免控件卡死
    if(DRAG&&Date.now()-(DRAG.t||0)>6000){DRAG.proxy.remove();DRAG.el.style.opacity='';DRAG=null;}
    if(DRAG)return;
    e.preventDefault();
    const r=el.getBoundingClientRect();
    const proxy=el.cloneNode(true);
    proxy.removeAttribute('id');
    proxy.querySelectorAll('[id]').forEach(n=>n.removeAttribute('id'));
    proxy.classList.add('fm-dragging');
    proxy.style.cssText+=`;position:fixed;left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;margin:0;z-index:9999;pointer-events:none;transition:none;transform:scale(1.1);box-shadow:0 18px 30px rgba(0,0,0,.28);`;
    document.body.appendChild(proxy);
    DRAG={el,proxy,cfg,moved:false,sx:e.clientX,sy:e.clientY,t:Date.now(),
      dx:e.clientX-r.left,dy:e.clientY-r.top};
    el.style.opacity='.35';
    playTone(430,.05,'sine',.07);
  });
}
document.addEventListener('pointermove',e=>{
  if(!DRAG)return;
  const dx=e.clientX-DRAG.sx,dy=e.clientY-DRAG.sy;
  if(!DRAG.moved&&dx*dx+dy*dy>56)DRAG.moved=true;
  DRAG.proxy.style.left=(e.clientX-DRAG.dx)+'px';
  DRAG.proxy.style.top=(e.clientY-DRAG.dy)+'px';
  const d=dropAt(e.clientX,e.clientY);
  DROPS.forEach(t=>{
    if(t.el&&t.el.isConnected)t.el.classList.toggle('fm-slot-hover',t===d&&t.el.dataset.lock!=='1');
  });
},{passive:true});
document.addEventListener('pointerup',e=>{
  if(!DRAG)return;
  const {el,proxy,cfg,moved}=DRAG;
  const d=moved?dropAt(e.clientX,e.clientY):null;
  DROPS.forEach(t=>{if(t.el&&t.el.isConnected)t.el.classList.remove('fm-slot-hover');});
  proxy.remove();
  el.style.opacity='';
  DRAG=null;
  if(d){
    const ok=(typeof d.match==='function')?d.match(cfg.key):(d.match===cfg.key);
    cfg.onDrop&&cfg.onDrop(ok,el,d.el,e.clientX,e.clientY);
  }else{
    if(!moved&&cfg.onTap){cfg.onTap(el,e.clientX,e.clientY);return;}
    el.animate([
      {transform:'translate(0,0) scale(1.12)'},
      {transform:'translate(0,0) scale(.94)',offset:.6},
      {transform:'translate(0,0) scale(1)'}
    ],{duration:260,easing:'ease-out'});
    playTone(300,.08,'sine',.06);
  }
});
document.addEventListener('pointercancel',()=>{if(DRAG){DRAG.proxy.remove();DRAG.el.style.opacity='';DRAG=null;}});
window.addEventListener('blur',()=>{if(DRAG){DRAG.proxy.remove();DRAG.el.style.opacity='';DRAG=null;}});

  const w=c.scrollWidth,h=c.scrollHeight;
  if(!pw||!ph||!w||!h)return;
  const kw=(w>pw)?(pw-8)/w:1;

  const k=Math.min(1,kw,kh);

}

function replayGame(){

  hudStart();startLevel();

function replayLevel(){

  ROUND.combo=0;ROUND.errStreak=0;

}
function startLevel(){

  ROUND.lvStartAt=Date.now();ROUND.lvWrong=0;

function quitToMenu(){

function backToMenu(){quitToMenu();}
function startPlayGame(id){

  gid('play-game').style.display='flex';

let carIdx=2,carCards=[];
function renderPlayMenu(){
  const carousel=gid('carousel');

  const bestAll=getBest();
  PLAY_GAMES.forEach((g,i)=>{
    const best=bestAll[g.id]||0;

        <div style="font-size:17px;color:#9A8C74;margin-top:8px;line-height:1.4;">${g.desc}</div>

      </div>`;
    card.addEventListener('click',()=>{
      if(i!==carIdx){carIdx=i;renderCar();playTone(400,.06,'sine',.08);}
      else{playTone(600,.08,'sine',.12);startPlayGame(g.id);}
    });
    carousel.appendChild(card);carCards.push(card);
  });
  renderCar();
}
function renderCar(){
  const total=PLAY_GAMES.length,cardW=372,gap=34;
  carCards.forEach((card,i)=>{
    let offset=i-carIdx;
    if(offset>total/2)offset-=total;
    if(offset<-total/2)offset+=total;
    const abs=Math.abs(offset);
    card.style.transform=`translateX(${offset*(cardW*0.55+gap)}px) translateZ(${-abs*140}px) rotateY(${offset===0?0:(offset>0?-22:22)}deg) scale(${offset===0?1:0.82})`;
    card.style.opacity=abs>2?0:(offset===0?1:0.5);
    card.style.zIndex=10-abs;
    card.style.borderColor=offset===0?'#5BB8FF':'#fff';
    card.style.pointerEvents=abs>2?'none':'auto';
  });
  const g=PLAY_GAMES[carIdx];
  const lb=gid('car-label');if(lb)lb.textContent=g.name;
}
gid('car-prev').addEventListener('click',()=>{carIdx=(carIdx-1+PLAY_GAMES.length)%PLAY_GAMES.length;renderCar();playTone(400,.06,'sine',.08);});
gid('car-next').addEventListener('click',()=>{carIdx=(carIdx+1)%PLAY_GAMES.length;renderCar();playTone(500,.06,'sine',.08);});
gid('car-start').addEventListener('click',()=>{playTone(600,.08,'sine',.12);startPlayGame(PLAY_GAMES[carIdx].id);});
(function(){
  const st=gid('car-stage');let sx=null,sy=null;
  st.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;});
  st.addEventListener('pointerup',e=>{
    if(sx==null)return;
    const dx=e.clientX-sx,dy=e.clientY-sy;sx=null;
    if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.4){
      carIdx=(carIdx+(dx<0?1:-1)+PLAY_GAMES.length)%PLAY_GAMES.length;

    }
  });
})();

/* ================================================================
   10 个游戏（大控件版）

const GAME_BUILDERS={

  /* 1. 连连看 —— 经典记忆翻牌 */
  link(level){
    const pairs=[3,4,6][level-1],cols=[3,4,4][level-1],cw=[178,150,128][level-1];
    setTip('翻开两张卡片，找出一样的一对');
    progressSetup(pairs);
    const keys=shuffle(Object.keys(CUT_IMG)).slice(0,pairs);
    const deck=shuffle([...keys,...keys]);
    let open=[],lock=false;
    const wrap=mkEl('div',`display:grid;grid-template-columns:repeat(${cols},${cw}px);gap:18px;justify-content:center;align-content:center;`);
    const cards=[];
    deck.forEach(k=>{
      const card=mkEl('div',`width:${cw}px;height:${cw*1.2}px;perspective:800px;cursor:pointer;`);
      card.innerHTML=`<div class="mem-inner">
        <div class="mem-face mem-back"><span style="font-size:${Math.round(cw*0.38)}px;color:#fff;font-weight:800;">?</span></div>
        <div class="mem-face mem-front">${imgTag(k,Math.round(cw*0.62))}</div>
      </div>`;
      card.dataset.k=k;
      card.addEventListener('click',()=>{
        if(lock||card.dataset.done||card.classList.contains('mem-flipped'))return;
        card.classList.add('mem-flipped');playTone(520,.07,'sine',.1);
        open.push({card,k});
        if(open.length===2){
          lock=true;
          const [a,b]=open;
          if(a.k===b.k){
            setTimeout(()=>{
              a.card.dataset.done='1';b.card.dataset.done='1';
              a.card.classList.add('fm-pop');b.card.classList.add('fm-pop');
              const [cx,cy]=centerOf(b.card);
              hit(cx,cy);
              open=[];lock=false;
            },380);
          }else{
            setTimeout(()=>{
              a.card.classList.remove('mem-flipped');b.card.classList.remove('mem-flipped');
              playTone(220,.1,'sine');
              ROUND.wrong++;ROUND.lvWrong++;ROUND.combo=0;ROUND.errStreak++;hudRender();
              if(ROUND.errStreak>=2&&ROUND.hintFn){const f=ROUND.hintFn;ROUND.errStreak=0;setTimeout(f,420);}
              open=[];lock=false;
            },820);
          }
        }
      });
      cards.push(card);wrap.appendChild(card);
    });
    setHint(()=>{
      if(lock)return;
      lock=true;
      cards.forEach(c=>{if(!c.dataset.done)c.classList.add('mem-flipped');});
      setTimeout(()=>{cards.forEach(c=>{if(!c.dataset.done)c.classList.remove('mem-flipped');});lock=false;},1050);
    });
    stage().appendChild(wrap);
  },

  /* 2. 形状配对 */
  shape(level){
    const all=['circle','square','triangle','star','heart','diamond','pentagon','oval'];
    const n=[3,4,6][level-1];
    setTip('把彩色形状拖到一样形状的洞里');
    progressSetup(n);
    const keys=shuffle(all).slice(0,n);
    const colors=['#FF6B6B','#3A9AE0','#6FCF7E','#FFD54F','#9C7BD8','#FF9F40','#26C6DA','#EC6B9D'];
    const S=148;
    const holes=mkEl('div','display:flex;gap:24px;justify-content:center;flex-wrap:wrap;');
    const pieces=mkEl('div','display:flex;gap:24px;justify-content:center;flex-wrap:wrap;');
    const wrap=mkEl('div','display:flex;flex-direction:column;gap:52px;justify-content:center;align-items:center;');
    keys.forEach(k=>{
      const h=mkEl('div',`width:${S}px;height:${S}px;border-radius:26px;background:#F4F0E6;display:flex;align-items:center;justify-content:center;border:5px dashed #CFC7B6;transition:all .18s;`);

      const b=mkEl('div',`width:${S}px;height:${S}px;border-radius:26px;background:#fff;border:4px solid #FFE0B8;display:flex;align-items:center;justify-content:center;box-shadow:0 7px 0 rgba(61,47,31,.12);`,
        `<svg viewBox="0 0 100 100" width="104" height="104">${SHAPES[k](col)}</svg>`);
      dragify(b,{key:k,onDrop:(ok,el,drop,x,y)=>{
        if(ok){
          el.dataset.lock='1';el.style.visibility='hidden';
          drop.dataset.lock='1';
          drop.style.borderStyle='solid';drop.style.borderColor='#6FCF7E';drop.style.background='#EAF9EC';

          drop.classList.add('fm-pop');
          const [cx,cy]=centerOf(drop);hit(cx,cy);
          if(Math.random()<.5)speakChar(SHAPE_NAME[k]);
        }else{miss(el);missShake(drop);}
      }});
      pieces.appendChild(b);
    });
    setHint(()=>{
      const h=holes.querySelector('div:not([data-lock="1"])');
      if(h){h.classList.add('fm-glow');setTimeout(()=>h.classList.remove('fm-glow'),1700);}
    });
    wrap.appendChild(holes);wrap.appendChild(pieces);
    stage().appendChild(wrap);
  },

  /* 3. 颜色分类 */
  color(level){
    const palette=[['#FF6B6B','红'],['#FFD54F','黄'],['#3A9AE0','蓝'],['#6FCF7E','绿'],['#9C7BD8','紫']];

    const ballsRow=mkEl('div','display:flex;gap:28px;justify-content:center;flex-wrap:wrap;align-items:center;');
    const basketsRow=mkEl('div','display:flex;gap:34px;justify-content:center;flex-wrap:wrap;align-items:flex-end;');
    const wrap=mkEl('div','display:flex;flex-direction:column;justify-content:space-evenly;align-items:center;gap:36px;');
    const basketEls={};
    chosen.forEach(([c,name])=>{
      const bk=mkEl('div','display:flex;flex-direction:column;align-items:center;cursor:pointer;');
      const bucket=mkEl('div',`position:relative;width:152px;height:124px;background:${c};border-radius:10px 10px 44px 44px;box-shadow:inset 0 -18px 0 rgba(0,0,0,.14);overflow:hidden;transition:transform .15s;`);
      bucket.innerHTML=`<div style="position:absolute;top:-3px;left:-8px;right:-8px;height:24px;background:${c};border-radius:10px;box-shadow:0 4px 0 rgba(0,0,0,.18);"></div><div class="bk-stack" style="position:absolute;bottom:6px;left:0;right:0;display:flex;gap:5px;justify-content:center;flex-wrap:wrap;padding:0 8px;"></div>`;
      bk.appendChild(bucket);
      bk.appendChild(mkEl('div','margin-top:12px;font-size:21px;font-weight:800;color:#5c4a33;background:#fff;padding:6px 22px;border-radius:20px;box-shadow:var(--shadow-sm);',name+'篮子'));
      basketsRow.appendChild(bk);
      basketEls[c]={bucket,stack:bucket.querySelector('.bk-stack'),count:0};

    });
    shuffle(balls).forEach(c=>{
      const b=mkEl('div',`width:112px;height:112px;border-radius:50%;background:radial-gradient(circle at 33% 28%,rgba(255,255,255,.85),rgba(255,255,255,0) 55%),${c};box-shadow:inset -12px -15px 0 rgba(0,0,0,.11);flex-shrink:0;`);
      b.dataset.c=c;
      dragify(b,{key:c,onDrop:(ok,el,drop,x,y)=>{
        if(ok){
          const info=basketEls[c];
          flyTo(el,info.bucket,400,.28);
          setTimeout(()=>{
            info.count++;
            info.stack.appendChild(mkEl('div',`width:30px;height:20px;border-radius:50%;background:${c};box-shadow:inset -4px -4px 0 rgba(0,0,0,.15);`));
            info.bucket.classList.add('fm-bounce');setTimeout(()=>info.bucket.classList.remove('fm-bounce'),640);
          },370);
          el.dataset.lock='1';
          hit(x,y);
        }else{miss(el);missShake(drop);}
      }});
      ballsRow.appendChild(b);
    });
    setHint(()=>{
      const first=ballsRow.querySelector('div:not([data-lock="1"])');
      if(first){
        const bk=basketEls[first.dataset.c];
        if(bk){bk.bucket.classList.add('fm-glow');setTimeout(()=>bk.bucket.classList.remove('fm-glow'),1700);}
      }
    });
    wrap.appendChild(ballsRow);wrap.appendChild(basketsRow);
    stage().appendChild(wrap);

  /* 4. 大小排序 */
  size(level){
    const n=[3,4,5][level-1];
    setTip('把气球按从小到大的顺序放进格子里');
    progressSetup(n);
    const base=70,step=32;
    const colors=['#FF6B6B','#FFA94D','#4FA8E8','#6FCF7E','#B78BE8','#F66D9C'];
    const balloonsRow=mkEl('div','display:flex;gap:32px;justify-content:center;align-items:flex-end;flex-wrap:wrap;');
    const slotsRow=mkEl('div','display:flex;gap:32px;justify-content:center;align-items:flex-end;flex-wrap:wrap;');
    const wrap=mkEl('div','display:flex;flex-direction:column;justify-content:center;align-items:center;gap:38px;');
    const labels=['最小','小','中','大','最大'];
    const slotEls=[];
    for(let i=0;i<n;i++){
      const d=base+i*step;
      const slot=mkEl('div',`position:relative;width:${d+26}px;height:${d*1.18+26}px;border:4px dashed #C9BFA6;border-radius:50% 50% 48% 48%/55% 55% 45% 45%;background:rgba(255,255,255,.7);display:flex;align-items:flex-end;justify-content:center;transition:all .18s;`);
      slot.appendChild(mkEl('span','font-size:19px;font-weight:800;color:#A99C7C;padding-bottom:4px;',n>1?labels[Math.round(i*4/(n-1))]:''));
      slotsRow.appendChild(slot);slotEls.push(slot);
      addDrop(slot,(dk)=>dk===i);
    }
    shuffle([...Array(n).keys()]).forEach(rk=>{
      const d=base+rk*step,col=colors[rk%colors.length];
      const b=mkEl('div',`position:relative;width:${d}px;height:${d*1.18}px;border-radius:50% 50% 48% 48%/55% 55% 45% 45%;background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.75),rgba(255,255,255,0) 55%),${col};box-shadow:inset -9px -13px 0 rgba(0,0,0,.12);flex-shrink:0;`,
        `<div style="position:absolute;bottom:-13px;left:50%;transform:translateX(-50%);border-left:9px solid transparent;border-right:9px solid transparent;border-top:13px solid ${col};"></div>`);
      dragify(b,{key:rk,onDrop:(ok,el,drop,x,y)=>{
        if(ok){
          el.dataset.lock='1';el.style.visibility='hidden';
          drop.dataset.lock='1';
          drop.style.borderStyle='solid';drop.style.borderColor='#6FCF7E';drop.style.background='#F3FBF4';
          drop.innerHTML=`<div style="width:${d}px;height:${d*1.18}px;border-radius:50% 50% 48% 48%/55% 55% 45% 45%;background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.75),rgba(255,255,255,0) 55%),${col};box-shadow:inset -9px -13px 0 rgba(0,0,0,.12);margin:0 auto;"></div>`;
          drop.classList.add('fm-pop');
          const [cx,cy]=centerOf(drop);hit(cx,cy);

  /* 5. 数字排序 */
  number(level){
    const n=[5,7,9][level-1];
    setTip('拖动小青蛙，按 1、2、3…的顺序跳荷叶');
    progressSetup(n);
    const wrap=mkEl('div','position:relative;height:100%;width:100%;display:flex;flex-direction:column;');
    stage().appendChild(wrap);
    const padArea=mkEl('div','position:relative;flex:1;min-height:0;');
    wrap.appendChild(padArea);
    const tray=mkEl('div','flex:none;height:126px;display:flex;align-items:center;justify-content:center;gap:14px;border-top:4px dashed #CFE8CF;margin-top:8px;');
    tray.appendChild(mkEl('div','font-size:22px;color:#6E9A6E;font-weight:800;',ICON('frog',34,'-10px')+' 拖动小青蛙去跳荷叶'));
    wrap.appendChild(tray);

    const cols=Math.ceil(Math.sqrt(n*1.7)),rows=Math.ceil(n/cols);
    const cells=[];for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)cells.push([c,r]);
    let expected=1;
    const padEls={};
    shuffle(cells).slice(0,n).forEach(([c,r],i)=>{
      const num=i+1;
      const jx=(Math.random()-.5)*6,jy=(Math.random()-.5)*8;
      const x=((c+.5)/cols)*100+jx,y=((r+.5)/rows)*100+jy;
      const pad=mkEl('div',`position:absolute;left:${x}%;top:${y}%;width:124px;height:124px;margin:-62px 0 0 -62px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#8BE79B,#4CAF6A);box-shadow:0 8px 0 rgba(47,105,66,.35);display:flex;align-items:center;justify-content:center;cursor:pointer;border:5px solid #2E7D4F;transition:box-shadow .2s,border-color .2s;`,
        `<span style="font-size:52px;font-weight:800;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25);">${num}</span>`);
      padArea.appendChild(pad);padEls[num]=pad;
      addDrop(pad,()=>num===expected);
      pad.addEventListener('click',()=>{
        if(num!==expected){miss(pad);return;}
        landFrog(pad);
      });
    });

    const frogBox=mkEl('div','position:absolute;left:34px;margin-left:0;bottom:14px;width:112px;height:112px;z-index:30;cursor:grab;transition:left .4s cubic-bezier(.4,1.3,.6,1),top .4s cubic-bezier(.4,1.3,.6,1);');
    const frog=mkEl('div','width:112px;height:112px;text-align:center;filter:drop-shadow(0 7px 5px rgba(0,0,0,.25));',`<img src="assets/icons/frog.svg" alt="" draggable="false" style="width:106px;height:106px;pointer-events:none;">`);
    frogBox.appendChild(frog);
    wrap.appendChild(frogBox);

    function landFrog(pad){
      const wr=wrap.getBoundingClientRect(),pr=pad.getBoundingClientRect();
      const sc=(wrap.offsetWidth&&wr.width)?wr.width/wrap.offsetWidth:1;
      const lx=(pr.left-wr.left)/sc+(pr.width/sc)/2-56;
      const ly=(pr.top-wr.top)/sc+(pr.height/sc)/2-56;
      frogBox.style.marginLeft='0';
      frogBox.style.bottom='auto';
      frogBox.style.left=lx+'px';
      frogBox.style.top=ly+'px';
      frog.classList.add('fm-bounce');setTimeout(()=>frog.classList.remove('fm-bounce'),640);
      pad.style.borderColor='#FFD54F';
      pad.style.boxShadow='0 8px 0 rgba(224,165,26,.45)';
      const [cx,cy]=centerOf(pad);
      hit(cx,cy);
      expected++;
    }
    dragify(frogBox,{key:'frog',onDrop:(ok,el,drop,x,y)=>{
      if(ok)landFrog(drop);else{miss(frog);if(drop)missShake(drop);}
    }});
    setHint(()=>{
      const p=padEls[expected];
      if(p){p.classList.add('fm-glow');setTimeout(()=>p.classList.remove('fm-glow'),1700);}
    });
  },

  /* 6. 影子配对 */
  shadow(level){
    const n=[3,4,5][level-1];
    const keys=shuffle(Object.keys(CUT_IMG)).slice(0,n);
    setTip('把小物品拖到它的影子上面');
    progressSetup(n);
    const top=mkEl('div','display:flex;gap:26px;justify-content:center;flex-wrap:wrap;');
    const bot=mkEl('div','display:flex;gap:26px;justify-content:center;flex-wrap:wrap;');
    const wrap=mkEl('div','display:flex;flex-direction:column;gap:46px;justify-content:center;align-items:center;');
    keys.forEach(k=>{
      const s=mkEl('div','width:150px;height:150px;border-radius:26px;background:#EAE7F0;display:flex;align-items:center;justify-content:center;border:4px solid #D5CFE0;transition:all .2s;');
      s.innerHTML=silTag(k,104);
      bot.appendChild(s);
      addDrop(s,k);
    });
    shuffle(keys).forEach(k=>{
      const b=mkEl('div','width:150px;height:150px;border-radius:26px;background:#fff;border:4px solid #FFE0B8;display:flex;align-items:center;justify-content:center;box-shadow:0 7px 0 rgba(61,47,31,.12);',imgTag(k,106));
      dragify(b,{key:k,onDrop:(ok,el,drop,x,y)=>{
        if(ok){
          el.dataset.lock='1';el.style.visibility='hidden';
          drop.dataset.lock='1';
          drop.style.background='#FFFDF5';drop.style.borderColor='#6FCF7E';
          drop.innerHTML=imgTag(k,106);
          drop.classList.add('fm-pop');
          const [cx,cy]=centerOf(drop);hit(cx,cy);
        }else{miss(el);missShake(drop);}
      }});
      top.appendChild(b);
    });
    setHint(()=>{
      const s=bot.querySelector('div:not([data-lock="1"])');
      if(s){s.classList.add('fm-glow');setTimeout(()=>s.classList.remove('fm-glow'),1700);}
    });
    wrap.appendChild(top);wrap.appendChild(bot);
    stage().appendChild(wrap);
  },

  /* 7. 动物喂食 */
  feed(level){
    const all=[['小猫','cat'],['小兔','rabbit'],['小熊','bear'],['小狗','dog']];
    const n=[2,3,4][level-1];
    const pairs=shuffle(all).slice(0,n);
    setTip('小动物饿了，把它们爱吃的食物拖过去吧');
    progressSetup(n);
    const animalsRow=mkEl('div','display:flex;gap:32px;justify-content:center;flex-wrap:wrap;');
    const foodsRow=mkEl('div','display:flex;gap:30px;justify-content:center;flex-wrap:wrap;');
    const wrap=mkEl('div','display:flex;flex-direction:column;gap:48px;justify-content:center;align-items:center;');
    const animalEls={};
    pairs.forEach(([name,ak])=>{
      const a=mkEl('div','display:flex;flex-direction:column;align-items:center;cursor:pointer;');
      a.appendChild(mkEl('div','width:158px;height:158px;border-radius:30px;background:#FFF6E8;border:4px solid #FFE0B8;display:flex;align-items:center;justify-content:center;box-shadow:0 7px 0 rgba(61,47,31,.12);',imgTag(ak,120)));
      a.appendChild(mkEl('div','margin-top:12px;font-size:24px;font-weight:800;color:#5c4a33;background:#fff;padding:6px 24px;border-radius:20px;box-shadow:var(--shadow-sm);',name));
      animalsRow.appendChild(a);animalEls[ak]=a;
      addDrop(a,FOOD_OF[ak]);
    });
    const extras=Object.values(FOOD_OF).filter(f=>!pairs.some(([,ak])=>FOOD_OF[ak]===f));
    const distrPool=[...(extras.length?extras:[]),'grape','strawberry','orange'].filter(Boolean);
    const foods=shuffle([...pairs.map(([,ak])=>FOOD_OF[ak]),...(level===3&&distrPool.length?[rnd(distrPool)]:[])]);
    foods.forEach(fk=>{
      const f=mkEl('div','width:126px;height:126px;border-radius:28px;background:#fff;border:4px solid #FFE0B8;display:flex;align-items:center;justify-content:center;box-shadow:0 7px 0 rgba(61,47,31,.12);',imgTag(fk,90));
      dragify(f,{key:fk,onDrop:(ok,el,drop,x,y)=>{
        if(ok){
          const ak=Object.keys(FOOD_OF).find(a=>FOOD_OF[a]===fk);
          const card=animalEls[ak].children[0];
          animalEls[ak].dataset.lock='1';
          flyTo(el,card,420,.24);
          setTimeout(()=>{
            card.classList.add('fm-bounce');setTimeout(()=>card.classList.remove('fm-bounce'),640);
            FX.burst(x,y,['#FF8FAB','#FFD54F','#FF6B6B'],14);
            FX.float(x,y-56,`<img src="assets/icons/heart.svg" style="width:52px;height:52px;display:block;" draggable="false">`,'#FF6B9D');
            speakChar(ANIMAL_NAME[ak]+'谢谢你');
          },400);
          el.dataset.lock='1';
          hit(x,y);
        }else{miss(el);missShake(drop);}
      }});
      foodsRow.appendChild(f);
    });
    setHint(()=>{
      const a=animalsRow.querySelector('div:not([data-lock="1"])');
      if(!a)return;
      const m=a.querySelector('img')&&a.querySelector('img').src.match(/(\w+)\.png/);
      if(m){
        const fk=FOOD_OF[m[1]];
        const food=foodsRow.querySelector(`div:not([data-lock="1"]) img[src*="${fk}"]`);
        const card=(food&&food.closest('div:not([data-lock="1"])'))||null;
        const t=card||a;
        t.classList.add('fm-glow');setTimeout(()=>t.classList.remove('fm-glow'),1700);
      }
    });
    wrap.appendChild(animalsRow);wrap.appendChild(foodsRow);
    stage().appendChild(wrap);
  },

  /* 8. 穿珠子 */
  bead(level){
    setTip('看一看规律，把珠子穿到绳子上');
    const COLOR_LETTER={A:'#FF6B6B',B:'#3A9AE0',C:'#FFD54F'};
    let pat,blanks;
    if(level===1){pat='ABABAB';blanks=[4];}
    else if(level===2){pat='ABABAB';blanks=[1,4];}
    else{pat='ABCABC';blanks=[1,3];}
    const blanksSet=new Set(blanks);
    progressSetup(blanks.length);
    const rope=mkEl('div','position:relative;display:flex;gap:20px;align-items:center;justify-content:center;padding:14px 0;');
    rope.appendChild(mkEl('div','position:absolute;left:3%;right:3%;top:50%;height:7px;background:#C9A06B;border-radius:4px;transform:translateY(-50%);'));
    const slotEls=[];
    [...pat].forEach((ch,i)=>{
      if(blanksSet.has(i)){
        const q=mkEl('div','width:100px;height:100px;border-radius:50%;border:4px dashed #B9AE93;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;font-size:40px;color:#B9AE93;font-weight:800;position:relative;z-index:2;transition:all .18s;','?');
        rope.appendChild(q);slotEls.push({el:q,ch});addDrop(q,ch);
      }else{
        rope.appendChild(mkEl('div',`width:92px;height:92px;border-radius:50%;background:${COLOR_LETTER[ch]};box-shadow:inset -12px -14px 0 rgba(0,0,0,.13);position:relative;z-index:2;flex-shrink:0;`));
      }
    });
    const distractors=['#6FCF7E','#9C7BD8'];
    const needLetters=[...new Set(blanks.map(i=>pat[i]))];
    const opts=shuffle([...needLetters,...distractors]);
    const optsRow=mkEl('div','display:flex;gap:30px;justify-content:center;flex-wrap:wrap;');
    opts.forEach(ch=>{
      const col=COLOR_LETTER[ch]||ch;
      const b=mkEl('div','width:116px;height:116px;border-radius:50%;background:#fff;border:4px solid #FFE0B8;display:flex;align-items:center;justify-content:center;box-shadow:0 7px 0 rgba(61,47,31,.12);',
        `<div style="width:82px;height:82px;border-radius:50%;background:${col};box-shadow:inset -9px -12px 0 rgba(0,0,0,.13);"></div>`);
      dragify(b,{key:ch,onDrop:(ok,el,drop,x,y)=>{
        if(ok){
          el.dataset.lock='1';el.style.visibility='hidden';
          drop.dataset.lock='1';
          drop.style.borderStyle='solid';drop.style.borderColor='#6FCF7E';
          drop.innerHTML=`<div style="width:92px;height:92px;border-radius:50%;background:${col};box-shadow:inset -11px -13px 0 rgba(0,0,0,.13);"></div>`;
          drop.classList.add('fm-pop');
          const [cx,cy]=centerOf(drop);hit(cx,cy);
          if(ROUND.done>=ROUND.need){setTimeout(()=>rope.classList.add('fm-bounce'),700);setTimeout(()=>rope.classList.remove('fm-bounce'),1340);}
        }else{miss(el);missShake(drop);}
      }});
      optsRow.appendChild(b);
    });
    setHint(()=>{
      const s=slotEls.find(s=>s.el.dataset.lock!=='1');
      if(s){s.el.classList.add('fm-glow');setTimeout(()=>s.el.classList.remove('fm-glow'),1700);}
    });
    const wrap=mkEl('div','display:flex;flex-direction:column;gap:52px;justify-content:center;align-items:center;');
    wrap.appendChild(rope);wrap.appendChild(optsRow);
    stage().appendChild(wrap);
  },

  /* 9. 找相同 */
  same(level){
    const total=[6,9,12][level-1],matches=[2,3,4][level-1],cols=[3,3,4][level-1];
    setTip('仔细找，把和上面一样的都点出来');
    progressSetup(matches);
    const keys=Object.keys(CUT_IMG);
    const target=rnd(keys);
    const others=shuffle(keys.filter(k=>k!==target)).slice(0,total-matches);
    const cells=shuffle([...Array(matches).fill(target),...others]);
    const sample=mkEl('div','background:#FFF6E0;border:5px solid #FFD54F;border-radius:26px;padding:16px 30px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:var(--shadow-sm);');
    sample.innerHTML=`${imgTag(target,128)}<span style="font-size:20px;color:#B8860B;font-weight:800;">找这个</span>`;
    const grid=mkEl('div',`display:grid;grid-template-columns:repeat(${cols},138px);gap:18px;justify-content:center;`);
    cells.forEach(k=>{
      const b=mkEl('div','width:138px;height:138px;border-radius:26px;background:#fff;border:4px solid #FFE0B8;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;box-shadow:0 7px 0 rgba(61,47,31,.12);',imgTag(k,96));
      b.addEventListener('click',()=>{
        if(b.dataset.done)return;
        if(k===target){
          b.dataset.done='1';
          b.style.borderColor='#6FCF7E';b.style.background='#EAF9EC';
          b.classList.add('fm-pop');
          const [cx,cy]=centerOf(b);hit(cx,cy);
        }else miss(b);
      });
      grid.appendChild(b);
    });
    setHint(()=>{
      const t=[...grid.children].find(d=>d.dataset.done!=='1'&&d.querySelector('img')&&d.querySelector('img').src.indexOf('/'+target+'.png')>=0);
      if(t){t.classList.add('fm-glow');setTimeout(()=>t.classList.remove('fm-glow'),1700);}
    });
    const wrap=mkEl('div','display:flex;flex-direction:column;gap:30px;align-items:center;justify-content:center;');
    wrap.appendChild(sample);wrap.appendChild(grid);
    stage().appendChild(wrap);
  },

  /* 10. 拼图 */
  puzzle(level){
    const gridN=[2,3,3][level-1];
    const key=rnd(['cat','strawberry','bear','rabbit','orange','dog','grape','chick']);
    setTip('把碎块拖回原位，拼出完整的图画');
    const inner=stage();
    const availW=inner.clientWidth||900,availH=inner.clientHeight||520;
    const S=Math.max(280,Math.min(availW-300,availH-30));
    const cell=S/gridN;
    progressSetup(gridN*gridN);
    const wrap=mkEl('div','display:flex;align-items:center;justify-content:center;gap:34px;');
    const board=mkEl('div',`position:relative;width:${S}px;height:${S}px;border-radius:20px;background:#F5F0E4;box-shadow:inset 0 0 0 6px #E4DAC2;flex-shrink:0;`);
    for(let i=1;i<gridN;i++){
      board.appendChild(mkEl('div',`position:absolute;left:${cell*i}px;top:0;width:0;height:${S}px;border-left:3px dashed #DACFB4;pointer-events:none;`));
      board.appendChild(mkEl('div',`position:absolute;top:${cell*i}px;left:0;height:0;width:${S}px;border-top:3px dashed #DACFB4;pointer-events:none;`));
    }
    const ghost=mkEl('div',`position:absolute;inset:0;background:url('${CUT_IMG[key]}') center/cover;border-radius:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50;`);
    board.appendChild(ghost);
    addDrop(board,()=>true);
    const side=mkEl('div','display:flex;flex-direction:column;align-items:center;gap:16px;flex-shrink:0;');
    const refW=Math.min(220,S*0.42);
    side.appendChild(mkEl('div',`width:${refW}px;height:${refW}px;border-radius:16px;overflow:hidden;border:5px solid #FFE0B8;background:#fff;box-shadow:var(--shadow-sm);`,
      `<img src="${CUT_IMG[key]}" style="width:100%;height:100%;object-fit:cover;">`));
    const peek=mkEl('button','font-family:inherit;font-size:19px;border:none;border-radius:30px;padding:12px 26px;background:#fff;color:var(--ink);box-shadow:var(--shadow-sm);cursor:pointer;font-weight:700;',`<img src="assets/icons/eye.svg" style="width:26px;height:26px;vertical-align:-7px;" draggable="false"> 按住看原图`);
    peek.addEventListener('pointerdown',e=>{e.preventDefault();ghost.style.opacity='.88';});
    ['pointerup','pointerleave','pointercancel'].forEach(ev=>peek.addEventListener(ev,()=>ghost.style.opacity='0'));
    side.appendChild(peek);
    wrap.appendChild(board);wrap.appendChild(side);
    inner.appendChild(wrap);
    const tiles=[];
    let pos=[...Array(gridN*gridN).keys()];
    for(let guard=0;guard<60;guard++){
      pos=shuffle(pos);
      if(!pos.some((p,i)=>p===i))break;
    }
    function putTile(t,idx){
      t.dataset.pos=idx;
      t.style.left=((idx%gridN)*cell)+'px';
      t.style.top=(Math.floor(idx/gridN)*cell)+'px';
    }
    pos.forEach((cellIdx,i)=>{
      const t=mkEl('div',`position:absolute;width:${cell}px;height:${cell}px;border-radius:10px;cursor:grab;box-shadow:0 5px 12px rgba(0,0,0,.22);transition:left .25s,top .25s;border:3px solid rgba(255,255,255,.92);background-image:url('${CUT_IMG[key]}');background-size:${S}px ${S}px;background-position:-${(i%gridN)*cell}px -${Math.floor(i/gridN)*cell}px;z-index:5;`);
      t.dataset.correct=i;
      putTile(t,cellIdx);
      dragify(t,{key:'t'+i,onDrop:(ok,el,drop,x,y)=>{
        if(el.dataset.lock==='1')return;
        const br=board.getBoundingClientRect();
        const sc=br.width/S||1;
        const c=Math.floor((x-br.left)/(cell*sc)),r=Math.floor((y-br.top)/(cell*sc));
        if(c<0||c>=gridN||r<0||r>=gridN)return;
        const idx2=r*gridN+c;
        if(idx2===+el.dataset.correct){
          el.dataset.lock='1';
          putTile(el,idx2);
          el.style.cursor='default';el.style.zIndex=2;el.style.borderColor='rgba(255,255,255,.5)';
          const [cx,cy]=centerOf(el);hit(cx,cy);
        }else{
          const other=tiles.find(o=>o!==el&&+o.dataset.pos===idx2&&o.dataset.lock!=='1');
          if(other){
            const from=+el.dataset.pos;
            putTile(other,from);putTile(el,idx2);
            other.classList.add('fm-pop');setTimeout(()=>other.classList.remove('fm-pop'),480);
            playTone(420,.06,'sine',.08);
          }else miss(el);
        }
      }});
      board.appendChild(t);tiles.push(t);
    });
    setHint(()=>{ghost.style.opacity='.88';setTimeout(()=>ghost.style.opacity='0',1300);});
  }
};

/* ================================================================
   游戏专属训练报告
================================================================ */
function renderGameReport(rec){
  const g=PLAY_GAMES.find(x=>x.id===rec.game)||{name:rec.gameName||'游戏',color:'#FF8C42',desc:''};
  const skills=GAME_SKILL[rec.game]||['手眼协调','专注力','视觉辨识','拖拽精准','持续注意'];
  const total=Math.max(1,rec.total||1);
  const acc=Math.round(rec.correct/total*100);
  const perItem=(rec.secs/total);
  const hist=(getHist()[rec.game]||[]).slice(0,6).reverse();
  const body=gid('greport-body');

  const statCard=(label,value,unit,color)=>
    `<div class="gr-stat" style="background:${color}1F;border:3px solid ${color}55;">
       <div class="gr-stat-v" style="color:${color};">${value}<span class="gr-stat-u">${unit||''}</span></div>
       <div class="gr-stat-l">${label}</div>
     </div>`;

  // 雷达分值
  const rv=[
    Math.max(20,Math.min(100,rec.score)),
    Math.max(20,Math.min(100,acc-4)),
    Math.max(20,Math.min(100,100-(rec.wrong||0)*8)),
    Math.max(20,Math.min(100,rec.score-6+(rec.combo||0)*3)),
    Math.max(20,Math.min(100,Math.round(100-Math.min(60,perItem*4))))
  ];

  // 关卡明细
  const lvRows=(rec.levels||[]).map(l=>{
    const st=l.wrong<=1?3:(l.wrong<=3?2:1);
    return `<tr>
      <td><b>第 ${l.lv} 关</b></td>
      <td>${fmtTime(l.secs)}</td>
      <td>${l.wrong} 次</td>
      <td>${[0,1,2].map(i=>STAR_SVG(18,i<st?'#FFC93C':'#EDE5D2')).join('')}</td>
    </tr>`;
  }).join('')||'<tr><td colspan="4" style="color:#999;">暂无关卡明细</td></tr>';

  // 建议
  const adv=[];
  if(rec.stars===3)adv.push('本轮表现优秀：动作控制与判断都很稳，几乎没有犹豫。');
  else if(rec.stars===2)adv.push('本轮表现良好：思路正确，个别环节还需要多想一想。');
  else adv.push('本轮需要加强：失误偏多，建议先由老师示范一遍再独立操作。');
  if(acc<70)adv.push('准确率偏低，可把当前游戏再玩一遍，熟悉目标特征后再慢慢提速。');
  if((rec.combo||0)>=5)adv.push(`专注力很好：连续答对 ${rec.combo} 次，说明注意力维持稳定。`);
  if(perItem>12)adv.push('单题耗时偏长，建议练习"先看清楚目标 → 再动手"的顺序。');
  else if(perItem<4)adv.push('完成速度很快，可尝试更高难度关卡，进一步挑战精细控制。');
  adv.push('专项训练建议：'+(GAME_TIP[rec.game]||'多鼓励、多重复，保持短时高频的练习节奏。'));
  adv.push('家庭延伸：每天 10 分钟同类小游戏，配合实物操作（抓豆子、串珠、拧瓶盖）效果更好。');

  body.innerHTML=`
    <div class="gr-head" style="background:linear-gradient(120deg,${g.color}22,${g.color}0D);border:4px solid ${g.color}55;">
      <div class="gr-head-l">
        <div class="gr-game">《${g.name}》训练报告</div>
        <div class="gr-meta">${rec.student} · ${rec.date} · 模块：玩一玩 · 难度：${rec.levelsTotal||(rec.levels||[]).length} 关</div>
        <div class="gr-desc">${g.desc||''}</div>
      </div>
      <div class="gr-head-r">
        <div class="gr-bigstar">${[0,1,2].map(i=>`<span style="display:inline-block;animation:fm-star .5s ease ${.1+i*.22}s both;">${STAR_SVG(46,i<rec.stars?'#FFC93C':'#EDE5D2')}</span>`).join('')}</div>
        <div class="gr-score">综合得分 <b style="color:#F5731F;">${rec.score}</b> 分</div>
      </div>
    </div>

    <div class="gr-stats">
      ${statCard('总用时',fmtTime(rec.secs),'','#3A9AE0')}
      ${statCard('完成题数',rec.total,'题','#6FCF7E')}
      ${statCard('正确率',acc,'%','#F5731F')}
      ${statCard('最高连击','×'+rec.combo,'','#E04D82')}
      ${statCard('失误次数',rec.wrong,'次','#D94545')}
      ${statCard('平均每题',perItem.toFixed(1),'秒','#9C7BD8')}
    </div>

    <div class="gr-grid2">
      <div class="gr-card">
        <h3>能力雷达（${g.name}）</h3>
        <div id="gr-radar" style="height:300px;"></div>
      </div>
      <div class="gr-card">
        <h3>逐关表现</h3>
        <table class="gr-table">
          <thead><tr><th>关卡</th><th>用时</th><th>失误</th><th>评价</th></tr></thead>
          <tbody>${lvRows}</tbody>
        </table>
        <div class="gr-trend-title">最近 ${hist.length} 次得分趋势</div>
        <div id="gr-trend" style="height:190px;"></div>
      </div>
    </div>

    <div class="gr-card">
      <h3>评价与训练建议</h3>
      <div class="gr-advice">${adv.map(a=>'<div class="gr-adv-item">· '+a+'</div>').join('')}</div>
    </div>

    <div class="gr-card">
      <h3>老师笔记</h3>
      <textarea id="gr-note" class="gr-note" placeholder="记录本次课堂表现、需要关注的细节...">${rec.note||''}</textarea>
      <div class="gr-actions">
        <button class="big-btn btn-primary" onclick="saveGameNote(${rec.id})">保存笔记</button>
        <button class="big-btn btn-primary" style="background:#5FC46E;" onclick="replayGame();showView('view-match');">再玩一次</button>
        <button class="big-btn btn-ghost" onclick="quitToMenu();showView('view-match');">选别的游戏</button>
        <button class="big-btn btn-ghost" onclick="goHome()">返回首页</button>
      </div>
    </div>`;

  showView('view-greport');
  gid('btn-back').style.display='flex';
  setTimeout(()=>{
    try{
      const radar=echarts.init(gid('gr-radar'));
      radar.setOption({
        tooltip:{},
        radar:{indicator:skills.map(s=>({name:s,max:100})),radius:'66%',
          splitArea:{areaStyle:{color:['#FFFDF7','#FFF7E9']}},
          axisName:{fontSize:13,color:'#7A6550'}},
        series:[{type:'radar',data:[{value:rv,name:'本次能力',
          areaStyle:{color:'rgba(255,140,66,.32)'},lineStyle:{color:'#FF8C42',width:3},itemStyle:{color:'#FF8C42'}}]}]
      });
      const data=hist.length?hist.map(h=>h.score):[rec.score];
      const trend=echarts.init(gid('gr-trend'));
      trend.setOption({
        grid:{left:44,right:18,top:18,bottom:30},
        tooltip:{trigger:'axis'},
        xAxis:{type:'category',data:hist.length?hist.map((_,i)=>'第'+(i+1)+'次'):['本次'],
          axisLine:{lineStyle:{color:'#C9BFA6'}},axisLabel:{color:'#7A6550',fontSize:12}},
        yAxis:{type:'value',min:40,max:100,axisLine:{lineStyle:{color:'#C9BFA6'}},axisLabel:{color:'#7A6550',fontSize:12},splitLine:{lineStyle:{color:'#F0E7D4'}}},
        series:[{type:'line',smooth:true,showSymbol:true,symbolSize:10,data:data,
          lineStyle:{color:'#3A9AE0',width:3},itemStyle:{color:'#3A9AE0'},areaStyle:{color:'rgba(58,154,224,.15)'}}]
      });
    }catch(e){}
  },160);
}
function saveGameNote(id){
  const txt=gid('gr-note').value;
  const rs=getReports();const i=rs.findIndex(r=>r.id===id);
  if(i>=0){rs[i].note=txt;saveReports(rs);}
  showTip('笔记已保存');
}
renderPlayMenu();



window.addEventListener('resize',()=>{
  if(state.currentGame==='write'&&document.getElementById('view-write').classList.contains('active'))initWrite();
  if(state.currentGame==='paint'&&document.getElementById('view-paint').classList.contains('active'))initPaint();
  if(ROUND.inner&&document.getElementById('play-game').style.display==='flex')fitStage();
});
</script>
