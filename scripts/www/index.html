<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="assets/echarts.min.js"></script>
<title>精细动作训练系统</title>
<!--
  ============================================================
  外置资源（assets/目录，已上传CDN）：
  - bg-classroom.jpg  教室背景
  - write-kid.jpg     写一写卡片图
  - paint-kid.jpg     画一画卡片图
  - match-kid.jpg     配一配卡片图
  - logo.jpg          系统logo
  ============================================================
-->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%23FF8C42'/></svg>">

<style>
  :root{
    --ink:#3D2F1F; --ink-soft:#7A6550;
    --orange:#FF8C42; --orange-deep:#F5731F;
    --blue:#4FA8E8; --blue-deep:#2D84C7;
    --yellow:#FFC93C; --yellow-deep:#E0A51A;
    --green:#5FC46E; --green-deep:#3FA54F;
    --white:#fff;
    --shadow:0 10px 0 rgba(61,47,31,.15);
    --shadow-sm:0 5px 0 rgba(61,47,31,.12);
    --radius:32px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:'ZCOOL KuaiLe','Noto Sans SC',system-ui,sans-serif;
    color:var(--ink);overflow:hidden;user-select:none;-webkit-user-select:none;
    touch-action:manipulation;background:#BEE3F8;
  }
  .bg{
    position:fixed;inset:0;z-index:0;
    background:url('assets/bg.jpg') center/cover no-repeat;
  }
  .bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,248,230,.55),rgba(255,248,230,.35) 50%,rgba(255,248,230,.65));}

  /* 顶栏 */
  .topbar{
    position:relative;z-index:310;display:flex;align-items:center;justify-content:space-between;
    padding:16px 32px;gap:16px;
  }
  /* 左：学生信息 */
  .student-box{
    display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.92);
    padding:8px 20px 8px 8px;border-radius:40px;box-shadow:var(--shadow-sm);min-width:180px;
  }
  .student-box .avatar{
    width:48px;height:48px;border-radius:50%;background:var(--blue);
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;
  }
  .student-box .name{font-size:22px;}
  .student-box .name small{display:block;font-size:14px;color:var(--ink-soft);font-family:'Noto Sans SC',sans-serif;}
  /* 中：logo+标题 */
  .brand{display:flex;align-items:center;gap:14px;}
  .brand img{width:60px;height:60px;border-radius:18px;box-shadow:var(--shadow-sm);}
  .brand .titles h1{font-size:30px;font-weight:normal;letter-spacing:1px;line-height:1.1;}
  .brand .titles p{font-size:16px;color:var(--ink-soft);font-family:'Noto Sans SC',sans-serif;}
  /* 右：设置按钮 */
  .icon-btn{
    width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.92);
    border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;
    box-shadow:var(--shadow-sm);transition:transform .1s;
  }
  .icon-btn:active{transform:scale(.92);}
  .back-btn{
    background:rgba(255,255,255,.92);border:none;border-radius:40px;
    padding:12px 22px;font-size:20px;font-family:inherit;color:var(--ink);
    box-shadow:var(--shadow-sm);cursor:pointer;display:none;align-items:center;gap:6px;
  }
  .back-btn:active{transform:translateY(2px);}

  /* 视图 */
  .view{position:relative;z-index:2;width:100%;height:calc(100vh - 88px);display:none;padding:8px 32px 28px;}
  .view.active{display:flex;flex-direction:column;}

  /* 登录页 */
  #view-login{align-items:center;justify-content:center;}
  .login-card{
    background:rgba(255,255,255,.95);border-radius:40px;padding:48px 56px;
    box-shadow:var(--shadow);text-align:center;max-width:480px;width:100%;
  }
  .login-card .login-logo{width:110px;height:110px;border-radius:28px;margin:0 auto 16px;box-shadow:var(--shadow-sm);}
  .login-card h1{font-size:34px;font-weight:normal;margin-bottom:6px;}
  .login-card p{font-size:18px;color:var(--ink-soft);margin-bottom:24px;}
  .login-card input{
    width:100%;padding:16px 24px;font-size:24px;font-family:inherit;
    border:3px solid #FFE0B8;border-radius:24px;background:#FFF8EC;
    outline:none;text-align:center;color:var(--ink);margin-bottom:18px;
  }
  .login-card input:focus{border-color:var(--orange);background:#fff;}
  .login-card .big-btn{
    width:100%;font-size:26px;padding:16px;border:none;border-radius:24px;
    background:var(--orange);color:#fff;font-family:inherit;cursor:pointer;
    box-shadow:0 6px 0 rgba(0,0,0,.15);
  }
  .login-card .big-btn:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.15);}

  /* 主页 */
  #view-home{align-items:center;justify-content:center;gap:24px;}
  .home-title{text-align:center;background:rgba(255,255,255,.88);padding:16px 44px;border-radius:40px;box-shadow:var(--shadow-sm);}
  .home-title h1{font-size:44px;font-weight:normal;letter-spacing:2px;}
  .home-title p{font-size:20px;color:var(--ink-soft);margin-top:4px;}
  .home-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;width:100%;max-width:1180px;}
  .game-card{
    background:var(--white);border-radius:var(--radius);overflow:hidden;
    box-shadow:var(--shadow);cursor:pointer;transition:transform .15s;border:5px solid transparent;
    display:flex;flex-direction:column;
  }
  .game-card:active{transform:translateY(5px) scale(.98);}
  .game-card.c-blue{border-color:var(--blue);}
  .game-card.c-yellow{border-color:var(--yellow);}
  .game-card.c-green{border-color:var(--green);}
  .game-card .pic{width:100%;aspect-ratio:1/1;overflow:hidden;background:#FFF6E8;}
  .game-card .pic img{width:100%;height:100%;object-fit:cover;display:block;}
  .game-card .info{padding:18px 20px 22px;text-align:center;}
  .game-card h2{font-size:30px;font-weight:normal;margin-bottom:6px;}
  .game-card p{font-size:18px;color:var(--ink-soft);line-height:1.4;}

  /* 游戏区 */
  .game-header{text-align:center;margin-bottom:14px;}
  .game-header h2{display:inline-block;background:rgba(255,255,255,.92);padding:10px 36px;border-radius:40px;font-size:36px;font-weight:normal;box-shadow:var(--shadow-sm);}
  .game-header .tip{display:block;margin:10px auto 0;width:fit-content;background:rgba(255,255,255,.75);padding:6px 22px;border-radius:30px;font-size:19px;color:var(--ink-soft);}
  .play-area{flex:1;background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);position:relative;overflow:hidden;border:5px solid #FFE8C7;}
  #write-canvas,#paint-canvas{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair;}
  /* 画一画：画板样式 */
  #view-paint .play-area{
    background:#FFFDF5;
    border:14px solid #C68B4D;
    border-radius:6px;
    box-shadow:0 12px 30px rgba(120,70,20,.35), inset 0 0 0 3px #A06828;
    margin-bottom:70px;
    overflow:visible;
  }
  #view-paint .play-area::before,
  #view-paint .play-area::after{
    content:'';position:absolute;bottom:-70px;width:16px;height:90px;
    background:linear-gradient(#C68B4D,#8B5E2A);border-radius:4px;
    box-shadow:2px 2px 6px rgba(0,0,0,.25);
  }
  #view-paint .play-area::before{left:8%;transform:rotate(18deg);transform-origin:top center;}
  #view-paint .play-area::after{right:8%;transform:rotate(-18deg);transform-origin:top center;}

  /* 配一配 */
  #view-match .play-area{position:relative;padding:30px 40px;}
  .match-item{width:120px;height:120px;border-radius:24px;background:#FFF6E8;display:flex;align-items:center;justify-content:center;cursor:grab;position:absolute;z-index:5;box-shadow:0 6px 0 rgba(61,47,31,.12);}
  .basket-row{position:absolute;right:40px;top:50%;transform:translateY(-50%);display:flex;gap:36px;align-items:flex-end;}
  .basket{width:160px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;}
  .basket .label{margin-top:8px;font-size:21px;padding:6px 18px;border-radius:20px;background:#fff;box-shadow:var(--shadow-sm);}
  .basket.b-apple .label{color:#D94545;background:#FFE9E9;}
  .basket.b-banana .label{color:var(--yellow-deep);background:#FFF4D1;}
  .basket.b-grape .label{color:#8B68D0;background:#EFE6FF;}

  /* 弹窗通用 */
  .overlay{position:fixed;inset:0;background:rgba(61,47,31,.5);display:none;align-items:center;justify-content:center;z-index:400;}
  .overlay.show{display:flex;}
  .done-card,.settings-card{
    background:#fff;border-radius:36px;padding:40px 50px;text-align:center;
    box-shadow:0 14px 0 rgba(0,0,0,.18);animation:pop .3s ease;
  }
  @keyframes pop{0%{transform:scale(.6);opacity:0;}100%{transform:scale(1);opacity:1;}}
  .big-star{width:90px;height:90px;margin:0 auto 8px;}
  .done-card h2{font-size:40px;font-weight:normal;margin-bottom:8px;color:var(--orange-deep);}
  .done-card p{font-size:22px;color:var(--ink-soft);margin-bottom:26px;}
  .btn-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
  .big-btn{font-family:inherit;font-size:24px;border:none;border-radius:40px;padding:14px 32px;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.15);}
  .btn-primary{background:var(--orange);color:#fff;}
  .btn-ghost{background:#F1E6D6;color:var(--ink);}
  .btn-danger{background:#FFE0E0;color:#D94545;}

  /* 设置面板 */
  .settings-card{text-align:left;min-width:380px;}
  .settings-card h2{font-size:30px;font-weight:normal;text-align:center;margin-bottom:24px;}
  .setting-row{margin-bottom:22px;}
  .setting-row label{display:flex;justify-content:space-between;font-size:20px;margin-bottom:10px;}
  .setting-row label span:last-child{color:var(--ink-soft);}
  .setting-row input[type=range]{
    width:100%;height:24px;-webkit-appearance:none;appearance:none;
    background:#FFE8C7;border-radius:12px;outline:none;
  }
  .setting-row input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:36px;height:36px;border-radius:50%;
    background:var(--orange);cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.2);
  }
  .setting-close{margin-top:8px;width:100%;}

  .float-star{position:fixed;width:48px;height:48px;pointer-events:none;z-index:200;animation:floatUp 1s ease-out forwards;}
  @keyframes floatUp{0%{transform:translateY(0) scale(.5);opacity:1;}100%{transform:translateY(-180px) scale(1.4);opacity:0;}}

  /* 笔画选择栏 */
  .stroke-bar{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
  .stroke-btn{
    width:72px;height:72px;border-radius:20px;border:4px solid #FFE0B8;
    background:#fff;font-family:inherit;font-size:30px;color:var(--ink);
    cursor:pointer;box-shadow:var(--shadow-sm);transition:all .1s;
  }
  .stroke-btn:active{transform:translateY(3px);}
  .stroke-btn.active{background:var(--blue);color:#fff;border-color:var(--blue-deep);}

  /* 写一写三栏布局 */
  .write-layout{display:flex;gap:18px;flex:1;align-items:stretch;overflow:hidden;min-height:0;}
  .tool-panel{
    width:150px;background:rgba(255,255,255,.92);border-radius:24px;
    padding:18px 14px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;align-items:center;
    flex-shrink:0;min-height:0;overflow-y:auto;
  }
  .tool-title{font-size:18px;color:var(--ink-soft);margin-bottom:12px;}
  .color-row{display:flex;flex-direction:column;gap:12px;}
  .color-dot{
    width:40px;height:40px;border-radius:50%;border:3px solid #fff;
    box-shadow:0 0 0 2px #FFE0B8;cursor:pointer;transition:all .1s;
  }
  .color-dot.active{box-shadow:0 0 0 3px var(--blue);transform:scale(1.1);}
  .size-row{display:flex;flex-direction:column;gap:12px;align-items:center;}
  .mini-btn{
    flex:1;padding:10px 6px;font-size:16px;font-family:inherit;color:var(--ink);
    background:#fff;border:3px solid #FFE0B8;border-radius:14px;cursor:pointer;
  }
  .mini-btn:active{transform:translateY(2px);background:#FFF4D1;}
  .timer-box{
    width:100%;background:#FFF8E7;border-radius:16px;padding:8px 0;margin-bottom:12px;
    display:flex;flex-direction:column;align-items:center;gap:2px;
  }
  .mode-row{display:flex;flex-direction:column;gap:6px;width:100%;margin-bottom:6px;}
  .mode-btn{
    padding:10px 4px;font-size:16px;font-family:inherit;color:var(--ink-soft);
    background:#fff;border:3px solid #FFE0B8;border-radius:12px;cursor:pointer;
  }
  .mode-btn.active{background:#D6E9FF;border-color:var(--blue);color:var(--blue);font-weight:700;}
  .size-btn{
    width:48px;height:48px;border-radius:14px;border:3px solid #FFE0B8;background:#fff;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .size-btn span{border-radius:50%;background:var(--ink);display:block;}
  .size-btn.active{border-color:var(--blue);background:#E3F2FF;}
  .stroke-col{display:flex;flex-direction:column;gap:10px;overflow-y:auto;flex:1;min-height:0;width:100%;padding-bottom:4px;}
  .stroke-col .stroke-btn{width:80px;height:56px;font-size:24px;flex-shrink:0;margin:0 auto;}
  .cat-tabs{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;width:100%;flex-shrink:0;}
  .cat-tab{
    padding:8px 4px;font-size:16px;font-family:inherit;color:var(--ink-soft);
    background:transparent;border:none;border-bottom:3px solid transparent;cursor:pointer;
  }
  .cat-tab.active{color:var(--blue-deep);border-bottom-color:var(--blue);font-weight:bold;}
  .stroke-btn.big-char{font-size:28px;}

  @media (max-width:1000px){
    .home-cards{grid-template-columns:1fr;max-width:520px;}
    .game-card{flex-direction:row;}
    .game-card .pic{width:140px;aspect-ratio:1;flex-shrink:0;}
    .game-card .info{display:flex;flex-direction:column;justify-content:center;text-align:left;}
    .brand .titles p{display:none;}
  }

/* ===== 玩一玩 增强版动效 ===== */
.hud-chip{padding:6px 16px;border-radius:20px;font-size:16px;font-weight:700;box-shadow:var(--shadow-sm);white-space:nowrap;}
@keyframes fm-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.fm-shake{animation:fm-shake .45s;}
@keyframes fm-pop{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}
.fm-pop{animation:fm-pop .45s;}
@keyframes fm-bounce{0%,100%{transform:translateY(0)}35%{transform:translateY(-16px)}62%{transform:translateY(0)}80%{transform:translateY(-6px)}}
.fm-bounce{animation:fm-bounce .6s;}
@keyframes fm-glow{0%,100%{box-shadow:0 0 0 0 rgba(91,184,255,0)}50%{box-shadow:0 0 0 14px rgba(91,184,255,.55)}}
.fm-glow{animation:fm-glow .85s ease-in-out 2;}
@keyframes fm-ring{0%{transform:scale(.4);opacity:.95}100%{transform:scale(2.1);opacity:0}}
@keyframes fm-float{0%{transform:translate(-50%,-50%);opacity:1}100%{transform:translate(-50%,-170%);opacity:0}}
@keyframes fm-star{0%{transform:scale(0) rotate(-40deg);opacity:0}60%{transform:scale(1.35) rotate(10deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
.fm-slot-hover{border-color:#5BB8FF!important;background:#EAF6FF!important;transform:scale(1.07);}
.mem-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.4,1.3,.6,1);}
.mem-flipped .mem-inner{transform:rotateY(180deg);}
.mem-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;display:flex;align-items:center;justify-content:center;}
.mem-back{background:linear-gradient(135deg,#6BC1FF,#3A9AE0);border:4px solid #fff;box-shadow:0 5px 0 rgba(61,47,31,.12);}
.mem-front{background:#FFFDF5;border:4px solid #FFE0B8;transform:rotateY(180deg);}
.fm-drag{cursor:grab;}
.fm-drag:active{cursor:grabbing;}

/* ===== 玩一玩 v2：干净底板 / 大控件 / 报告 ===== */
/* 轮播大三角按钮：高度与两侧卡片一致（552 × 0.82 ≈ 452） */
.car-tri{
  position:absolute;top:50%;transform:translateY(-50%);
  width:104px;height:452px;border:none;background:transparent;cursor:pointer;
  z-index:30;padding:0;filter:drop-shadow(0 10px 16px rgba(224,107,157,.22));
  transition:transform .2s ease;
}
.car-tri:hover{transform:translateY(-50%) scale(1.06);}
.car-tri:active{transform:translateY(-50%) scale(.96);}
/* 训练游戏页与游戏报告页：全屏覆盖 */
#view-match.active,#view-greport.active{
  position:fixed;inset:0;z-index:300;height:100vh;border-radius:0;box-shadow:none;
}
#view-match{
  background:transparent;
  box-shadow:none;
  overflow:hidden;
  padding:96px 24px 16px;
  height:100vh;
}
/* 游戏进行区：自带不透明底，保证游戏画面干净 */
#play-game{
  background:linear-gradient(180deg,#FDF8EE 0%,#FAF3E3 100%);
  border-radius:24px;
}
.play-board{
  width:100%;height:100%;border-radius:24px;overflow:hidden;
  background:linear-gradient(180deg,#FFFFFF 0%,#FFFCF3 100%);
  box-shadow:inset 0 0 0 4px #FFEBCB, 0 6px 16px rgba(180,140,80,.10);
  display:flex;align-items:center;justify-content:center;padding:4px;
}
.hud-chip{padding:9px 22px;border-radius:26px;font-size:20px;font-weight:800;box-shadow:var(--shadow-sm);white-space:nowrap;}
.hud-bar{position:relative;width:min(360px,32vw);height:26px;background:#fff;border-radius:13px;box-shadow:inset 0 2px 5px rgba(0,0,0,.12);overflow:hidden;}
.hud-bar-in{height:100%;background:linear-gradient(90deg,#FFC96B,#FF8C42);border-radius:13px;transition:width .35s;}
.hud-bar-txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:#6a5535;text-shadow:0 1px 0 rgba(255,255,255,.85);}
#play-title{font-size:30px!important;padding:8px 34px!important;}
#play-tip{font-size:19px!important;padding:5px 24px!important;margin-top:7px!important;}
#play-back,#play-replay{font-size:19px!important;padding:12px 24px!important;}
.lv-card{min-width:420px;padding:44px 56px;}
.lv-emoji{font-size:78px;line-height:1.1;}
.lv-h2{font-size:40px!important;margin:10px 0 8px!important;}
.lv-p{font-size:21px!important;margin-bottom:26px!important;}
.star-row{display:flex;gap:14px;justify-content:center;margin:4px 0 10px;}
.btn-report{background:linear-gradient(135deg,#5BB8FF,#2D84C7);color:#fff;}

/* 游戏报告页 */
#view-greport{align-items:flex-start;padding:96px 40px 40px;background:#FFFDF6;overflow-y:auto;}
.gr-head{display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap;
  border-radius:24px;padding:22px 30px;margin-bottom:18px;}
.gr-game{font-size:34px;color:var(--ink);}
.gr-meta{font-size:17px;color:var(--ink-soft);margin-top:6px;font-family:'Noto Sans SC',sans-serif;}
.gr-desc{font-size:16px;color:#9A8C74;margin-top:4px;}
.gr-head-r{text-align:center;}
.gr-bigstar{display:flex;gap:10px;justify-content:center;}
.gr-score{font-size:20px;color:var(--ink-soft);margin-top:8px;}
.gr-score b{font-size:28px;}
.gr-stats{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:18px;}
.gr-stat{border-radius:20px;padding:16px 8px;text-align:center;}
.gr-stat-v{font-size:34px;font-weight:800;line-height:1.1;}
.gr-stat-u{font-size:16px;margin-left:2px;}
.gr-stat-l{font-size:15px;color:var(--ink-soft);margin-top:6px;}
.gr-grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px;}
.gr-card{background:#fff;border-radius:20px;padding:20px 22px;box-shadow:var(--shadow-sm);margin-bottom:18px;}
.gr-card h3{font-size:20px;font-weight:normal;color:var(--ink);margin-bottom:12px;}
.gr-table{width:100%;border-collapse:collapse;font-size:16px;}
.gr-table th{background:#FFF6E6;color:#8A7355;font-weight:700;padding:8px 10px;text-align:left;border-radius:8px;}
.gr-table td{padding:9px 10px;border-bottom:2px solid #F5EEDF;color:#4A3B2A;}
.gr-trend-title{font-size:15px;color:var(--ink-soft);margin:14px 0 4px;}
.gr-advice{font-size:17px;line-height:1.9;color:#4A3B2A;}
.gr-adv-item{padding:3px 0;}
.gr-note{width:100%;min-height:96px;padding:12px;border:2px solid #FFE0B8;border-radius:14px;
  font-size:16px;font-family:'Noto Sans SC',sans-serif;box-sizing:border-box;resize:vertical;color:var(--ink);}
.gr-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px;}
@media (max-width:1100px){
  .gr-stats{grid-template-columns:repeat(3,1fr);}
  .gr-grid2{grid-template-columns:1fr;}
}

<body>

<div class="bg"></div>

<!-- 顶栏 -->
<div class="topbar">
  <!-- 左：返回 + 选择学生 -->
  <div style="display:flex;gap:12px;align-items:center;">
    <button class="back-btn" id="btn-back" onclick="goHome()"><img src="assets/icons/back.svg" style="width:20px;height:20px;vertical-align:-4px;" draggable="false"> 返回</button>
    <div class="student-box" id="student-box" style="visibility:hidden;cursor:pointer;" onclick="toggleStuMenu(event)">
      <div class="avatar">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="#fff"><path d="M12 12a5 5 0 100-10 5 5 0 000 10zm0 2c-4 0-8 2-8 6v2h16v-2c0-4-4-6-8-6z"/></svg>
      </div>
      <div class="name"><span id="student-name">选择学生</span><small>点击切换/管理</small></div>
    </div>
    <!-- 学生下拉菜单：选择学生 / 学生管理 -->
    <div id="stu-menu" style="display:none;position:fixed;z-index:900;background:#fff;border-radius:18px;box-shadow:0 10px 30px rgba(61,47,31,.22);padding:10px;min-width:190px;border:2px solid #FFE0B8;">
      <button onclick="openStudents()" style="display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;border:none;background:transparent;border-radius:12px;font-family:inherit;font-size:18px;color:var(--ink);cursor:pointer;font-weight:600;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="#5BB8FF"><path d="M12 12a5 5 0 100-10 5 5 0 000 10zm0 2c-4 0-8 2-8 6v2h16v-2c0-4-4-6-8-6z"/></svg>
        选择学生
      </button>
      <button onclick="openManage()" style="display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;border:none;background:transparent;border-radius:12px;font-family:inherit;font-size:18px;color:var(--ink);cursor:pointer;font-weight:600;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="#FF8FAB"><path d="M3 5h18v4H3zm0 6h18v4H3zm0 6h18v4H3z" opacity=".9"/></svg>
        学生管理
      </button>
    </div>
  </div>

  <!-- 右：训练记录 + 设置 -->
  <div style="display:flex;gap:12px;align-items:center;">
    <button class="icon-btn" onclick="viewLogs()" title="训练记录">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#4A3B2A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="8" y1="13" x2="16" y2="13"/>
        <line x1="8" y1="17" x2="16" y2="17"/>
      </svg>
    </button>
    <button class="icon-btn" onclick="openSettings()" title="设置">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#4A3B2A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/>
      </svg>
    </button>
  </div>
</div>

<!-- 登录页 -->
<div class="view active" id="view-login">
  <div class="login-card">
    <img class="login-logo" src="assets/logo.png" alt="logo">
    <h1>欢迎使用</h1>
    <p>请输入账号密码登录</p>
    <input type="text" id="input-user" placeholder="账号" value="admin" maxlength="20">
    <input type="password" id="input-pass" placeholder="密码" maxlength="20" style="margin-top:12px;">
    <button class="big-btn" onclick="doLogin()" style="margin-top:18px;">登 录</button>
    <p id="login-err" style="color:#FF6B6B;font-size:14px;margin-top:10px;display:none;">账号或密码错误</p>
  </div>
</div>

<!-- 主页 -->
<div class="view" id="view-home">
  <div class="home-cards">
    <div class="game-card c-blue" onclick="startGame('write')">
      <div class="pic"><img src="assets/card-write.png" alt="写一写"></div>
      <div class="info"><h2>写一写</h2><p>跟着虚线，写一横一竖</p></div>
    </div>
    <div class="game-card c-yellow" onclick="startGame('paint')">
      <div class="pic"><img src="assets/card-paint.png" alt="画一画"></div>
      <div class="info"><h2>画一画</h2><p>给大苹果涂上颜色</p></div>
    </div>
    <div class="game-card c-green" onclick="startGame('match')">
      <div class="pic"><img src="assets/card-play.png" alt="玩一玩"></div>
      <div class="info"><h2>玩一玩</h2><p>十个小游戏，越玩越聪明</p></div>
    </div>
  </div>
</div>
</div>

<!-- 写一写 -->
<div class="view" id="view-write">
  <div class="write-layout">
    <!-- 左：笔设置 -->
    <div class="tool-panel">
      <div class="timer-box">
        <span style="font-size:14px;color:var(--ink-soft);">训练用时</span>
        <span id="timer" style="font-size:28px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;">00:00</span>
      </div>
      <div class="mode-row" id="mode-row">
        <button class="mode-btn active" data-mode="free">自由练习</button>
        <button class="mode-btn" data-mode="ai">AI课程</button>
        <button class="mode-btn" data-mode="teacher">教师课程</button>
      </div>
      <div class="tool-title" style="margin-top:14px;">画笔颜色</div>
      <div class="color-row" id="color-row">
        <button class="color-dot active" data-color="#FF6B6B" style="background:#FF6B6B;"></button>
        <button class="color-dot" data-color="#3A9AE0" style="background:#3A9AE0;"></button>
        <button class="color-dot" data-color="#6FCF7A" style="background:#6FCF7A;"></button>
        <button class="color-dot" data-color="#FF8C42" style="background:#FF8C42;"></button>
        <button class="color-dot" data-color="#9C7BD8" style="background:#9C7BD8;"></button>
        <button class="color-dot" data-color="#3D2F1F" style="background:#3D2F1F;"></button>
      </div>
      <div class="tool-title" style="margin-top:14px;">画笔粗细</div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
        <span style="font-size:14px;color:var(--ink-soft);">最粗</span>
        <input type="range" id="size-slider" min="6" max="30" value="12" orient="vertical" style="writing-mode:vertical-lr;width:24px;height:80px;-webkit-appearance:slider-vertical;appearance:slider-vertical;direction:rtl;">
        <span style="font-size:14px;color:var(--ink-soft);">最细</span>
      </div>
      <div style="margin-top:14px;display:flex;flex-direction:column;gap:8px;width:100%;align-items:center;">
        <button class="mini-btn" id="btn-undo" style="width:90px;">↩ 撤销</button>
        <button class="mini-btn" id="btn-clear" style="width:90px;">✕ 清除</button>
      </div>
    </div>
    <!-- 中：田字格 -->
    <div class="play-area" style="flex:1;"><canvas id="write-canvas"></canvas></div>
    <!-- 右：字帖选择 -->
    <div class="tool-panel">
      <div class="cat-tabs" id="cat-tabs">
        <button class="cat-tab active" data-cat="stroke">描红训练</button>
        <button class="cat-tab" data-cat="radical">偏旁部首</button>
        <button class="cat-tab" data-cat="char">文字练习</button>
      </div>
      <div class="stroke-col" id="stroke-list"></div>
    </div>
  </div>
</div>

<!-- 画一画 -->
<div class="view" id="view-paint" style="padding-bottom:90px;">
  <div style="display:flex;gap:18px;flex:1;align-items:stretch;overflow:hidden;min-height:0;">
    <!-- 左：调色板 -->
    <div class="tool-panel" style="width:130px;overflow-y:auto;">
      <div class="tool-title">调色板</div>
      <div class="color-row" id="paint-colors">
        <button class="color-dot active" data-color="#FF6B6B" style="background:#FF6B6B;"></button>
        <button class="color-dot" data-color="#3A9AE0" style="background:#3A9AE0;"></button>
        <button class="color-dot" data-color="#6FCF7A" style="background:#6FCF7A;"></button>
        <button class="color-dot" data-color="#FF8C42" style="background:#FF8C42;"></button>
        <button class="color-dot" data-color="#9C7BD8" style="background:#9C7BD8;"></button>
        <button class="color-dot" data-color="#FFD54F" style="background:#FFD54F;"></button>
        <button class="color-dot" data-color="#3D2F1F" style="background:#3D2F1F;"></button>
      </div>
      <div class="tool-title" style="margin-top:14px;">画笔粗细</div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
        <span style="font-size:13px;color:var(--ink-soft);">最粗</span>
        <input type="range" id="paint-slider" min="6" max="40" value="20" orient="vertical" style="writing-mode:vertical-lr;width:20px;height:80px;-webkit-appearance:slider-vertical;appearance:slider-vertical;direction:rtl;">
        <span style="font-size:13px;color:var(--ink-soft);">最细</span>
      </div>
      <button id="btn-paint-redo" class="mini-btn" style="width:100%;margin-top:14px;padding:12px 4px;font-size:16px;">重画</button>
    </div>
    <!-- 中：画板 -->
    <div class="play-area" style="flex:1;">
      <canvas id="paint-canvas"></canvas>
      <div id="paint-ref" style="position:absolute;left:16px;bottom:16px;width:126px;height:168px;background:#fff;border-radius:16px;box-shadow:0 4px 12px rgba(0,0,0,.15);display:flex;flex-direction:column;align-items:center;justify-content:center;border:3px solid #FFE0B8;gap:2px;">
        <canvas id="paint-ref-canvas" width="100" height="100" style="width:100px;height:100px;"></canvas>
        <div id="paint-ref-name" style="font-size:15px;color:#8A7355;font-weight:700;">参考图</div>
      </div>
    </div>
    <!-- 右：物品分类 -->
    <div class="tool-panel" style="width:160px;display:flex;flex-direction:column;overflow:hidden;">
      <div class="cat-tabs" id="paint-cat-tabs" style="flex-wrap:wrap;flex:none;">
        <button class="cat-tab active" data-pcat="fruit">水果</button>
        <button class="cat-tab" data-pcat="veg">蔬菜</button>
        <button class="cat-tab" data-pcat="animal">动物</button>
        <button class="cat-tab" data-pcat="trans">交通</button>
        <button class="cat-tab" data-pcat="dessert">甜品</button>
        <button class="cat-tab" data-pcat="nature">自然</button>
        <button class="cat-tab" data-pcat="object">物品</button>
      </div>
      <div id="paint-items" style="display:grid;grid-template-columns:1fr 1fr;gap:6px;overflow-y:auto;flex:1;padding:4px;align-content:start;"></div>
    </div>
  </div>
</div>

<!-- 玩一玩 -->
<!-- 玩一玩 -->
<!-- 玩一玩 -->
<div class="view" id="view-match">
  <!-- 游戏选择主页：3D 轮播卡片 -->
  <div id="play-menu" style="height:100%;position:relative;">
    <div id="car-stage" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;perspective:1300px;">
      <div id="carousel" style="position:relative;width:372px;height:552px;transform-style:preserve-3d;"></div>
      <button id="car-prev" class="car-tri" style="left:26px;" title="上一个">
        <svg viewBox="0 0 100 420" preserveAspectRatio="none" style="display:block;width:100%;height:100%;">
          <path d="M92 46 L92 374 Q92 394 84.2 375.6 L21.8 228.4 Q14 210 21.8 191.6 L84.2 44.4 Q92 26 92 46 Z" fill="#FFFFFF" stroke="#FFD9E4" stroke-width="3" stroke-linejoin="round"/>
          <path d="M66 160 L40 210 L66 260" fill="none" stroke="#FF8FAB" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button id="car-next" class="car-tri" style="right:26px;" title="下一个">
        <svg viewBox="0 0 100 420" preserveAspectRatio="none" style="display:block;width:100%;height:100%;">
          <path d="M8 46 L8 374 Q8 394 15.8 375.6 L78.2 228.4 Q86 210 78.2 191.6 L15.8 44.4 Q8 26 8 46 Z" fill="#FFFFFF" stroke="#FFD9E4" stroke-width="3" stroke-linejoin="round"/>
          <path d="M34 160 L60 210 L34 260" fill="none" stroke="#FF8FAB" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
    <div style="position:absolute;bottom:20px;left:0;right:0;text-align:center;z-index:20;">
      <button id="car-start" class="big-btn" style="padding:16px 60px;font-size:24px;background:linear-gradient(135deg,#FF8FAB,#FF6B9D);color:#fff;border:none;border-radius:36px;box-shadow:0 6px 0 #E04D82;cursor:pointer;">开始《<span id="car-label">连连看</span>》</button>
    </div>
  </div>
  <!-- 游戏容器 -->
  <div id="play-game" style="display:none;width:100%;flex-direction:column;flex:1;overflow:hidden;">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 24px 4px;flex:none;gap:10px;">
      <button class="big-btn btn-ghost" id="play-back" style="padding:10px 20px;font-size:17px;"><img src="assets/icons/back.svg" style="width:20px;height:20px;vertical-align:-4px;" draggable="false"> 返回选择</button>
      <div style="text-align:center;min-width:0;">
        <h2 id="play-title" style="font-size:26px;color:var(--ink);font-weight:normal;display:inline-block;background:rgba(255,255,255,.94);padding:6px 30px;border-radius:30px;box-shadow:var(--shadow-sm);"></h2>
        <div id="play-tip" style="font-size:16px;color:var(--ink-soft);margin-top:6px;display:inline-block;background:rgba(255,255,255,.82);padding:3px 20px;border-radius:20px;"></div>
      </div>
      <button class="big-btn btn-ghost" id="play-replay" style="padding:10px 20px;font-size:17px;"><img src="assets/icons/replay.svg" style="width:20px;height:20px;vertical-align:-4px;" draggable="false"> 重玩本关</button>
    </div>
    <div id="play-hud" style="flex:none;display:flex;align-items:center;justify-content:center;gap:12px;padding:4px 28px 6px;flex-wrap:wrap;"></div>
    <div id="play-stage" style="flex:1;position:relative;overflow:hidden;padding:8px 28px 16px;"></div>
  </div>
  <!-- 过关 / 结算浮层 -->
  <div id="level-overlay" style="position:absolute;inset:0;background:rgba(61,47,31,.45);display:none;align-items:center;justify-content:center;z-index:60;"></div>
</div>

<!-- 完成弹窗 -->
<div class="overlay" id="done-overlay">
  <div class="done-card">
    <svg class="big-star" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" fill="#FFC93C" stroke="#E0A51A" stroke-width="1"/></svg>
    <h2 id="done-title">太棒了！</h2>
    <p id="done-desc">你完成了训练，继续加油哦！</p>
    <div class="btn-row">
      <button class="big-btn btn-ghost" onclick="goHome()">返回主页</button>
      <button class="big-btn btn-primary" onclick="viewLogs()">查看报告</button>
    </div>
  </div>
</div>

<!-- 训练记录弹窗 -->
<div class="overlay" id="logs-overlay"></div>

<!-- 学员管理弹窗 -->
<div class="overlay" id="students-overlay"></div>

<!-- 全屏报告页 -->
<div class="view" id="view-report" style="align-items:flex-start;padding:30px 50px;background:#FFFEF8;overflow-y:auto;">
  <div style="max-width:1100px;width:100%;margin:0 auto;">
    <h1 style="font-size:34px;margin-bottom:6px;color:var(--ink);">训练报告</h1>
    <div id="report-meta" style="color:var(--ink-soft);font-size:17px;margin-bottom:20px;"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px;">
      <div style="background:#fff;border-radius:20px;padding:20px;box-shadow:var(--shadow-sm);">
        <h3 style="margin-bottom:10px;color:var(--ink);font-size:18px;">能力雷达</h3>
        <div id="report-radar" style="height:280px;"></div>
      </div>
      <div style="background:#fff;border-radius:20px;padding:20px;box-shadow:var(--shadow-sm);">
        <h3 style="margin-bottom:10px;color:var(--ink);font-size:18px;">近期进步趋势</h3>
        <div id="report-trend" style="height:280px;"></div>
      </div>
    </div>
    <div style="background:#fff;border-radius:20px;padding:20px;box-shadow:var(--shadow-sm);margin-bottom:18px;">
      <h3 style="margin-bottom:10px;color:var(--ink);font-size:18px;">本次完成</h3>
      <div id="report-items" style="display:flex;flex-wrap:wrap;gap:8px;"></div>
    </div>
    <div style="background:#fff;border-radius:20px;padding:20px;box-shadow:var(--shadow-sm);margin-bottom:18px;">
      <h3 style="margin-bottom:10px;color:var(--ink);font-size:18px;">成果展示</h3>
      <div id="report-art" style="text-align:center;"></div>
    </div>
    <div style="background:#fff;border-radius:20px;padding:20px;box-shadow:var(--shadow-sm);margin-bottom:18px;">
      <h3 style="margin-bottom:10px;color:var(--ink);font-size:18px;">优缺点与建议</h3>
      <div id="report-advice" style="font-size:16px;line-height:1.8;color:#444;"></div>
    </div>
    <div style="background:#fff;border-radius:20px;padding:20px;box-shadow:var(--shadow-sm);margin-bottom:18px;">
      <h3 style="margin-bottom:10px;color:var(--ink);font-size:18px;">训练笔记</h3>
      <textarea id="report-note" placeholder="老师可记录学生本次表现..." style="width:100%;min-height:90px;padding:12px;border:2px solid #FFE0B8;border-radius:12px;font-size:16px;font-family:inherit;box-sizing:border-box;resize:vertical;"></textarea>
    </div>
    <div style="display:flex;gap:14px;">
      <button class="big-btn btn-primary" onclick="saveReportNote()">保存记录</button>
      <button class="big-btn btn-ghost" onclick="goHome()">返回首页</button>
    </div>
  </div>
</div>

<!-- 玩一玩 · 游戏专属训练报告 -->
<div class="view" id="view-greport">
  <div id="greport-body" style="max-width:1080px;width:100%;margin:0 auto;"></div>
</div>

<!-- 全屏训练记录页 -->
<div class="view" id="view-logs" style="align-items:flex-start;padding:64px 60px 40px;background:#FFFEF8;border-radius:24px;margin:12px 24px;overflow-y:auto;box-shadow:var(--shadow-sm);">
  <button class="big-btn btn-ghost" onclick="goHome()" style="position:absolute;top:14px;left:22px;z-index:40;padding:10px 20px;font-size:17px;"><img src="assets/icons/back.svg" style="width:20px;height:20px;vertical-align:-4px;" draggable="false"> 返回</button>
  <div style="max-width:900px;width:100%;margin:0 auto;">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;margin-bottom:18px;">
      <h1 style="font-size:36px;color:var(--ink);">训练记录</h1>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
        <select id="log-filter-stu" onchange="renderLogsList()" style="font-family:inherit;font-size:17px;padding:10px 16px;border:2px solid #FFE0B8;border-radius:14px;background:#fff;color:var(--ink);cursor:pointer;outline:none;"></select>
        <select id="log-filter-mod" onchange="renderLogsList()" style="font-family:inherit;font-size:17px;padding:10px 16px;border:2px solid #FFE0B8;border-radius:14px;background:#fff;color:var(--ink);cursor:pointer;outline:none;"></select>
      </div>
    </div>
    <div id="logs-list"></div>
  </div>
</div>

<!-- 设置弹窗 -->
<div class="overlay" id="settings-overlay">
  <div class="settings-card">
    <h2>设置</h2>
    <div class="setting-row">
      <label><span>音量</span><span id="vol-val">80%</span></label>
      <input type="range" id="vol-slider" min="0" max="100" value="80" oninput="onVol(this.value)">
    </div>
    <div class="setting-row">
      <label><span>屏幕亮度</span><span id="bright-val">100%</span></label>
      <input type="range" id="bright-slider" min="50" max="150" value="100" oninput="onBright(this.value)">
    </div>
    <button class="big-btn btn-danger setting-close" onclick="logout()">退出登录</button>
    <div style="height:14px;"></div>
    <button class="big-btn btn-primary setting-close" onclick="closeSettings()">完成</button>
  </div>
</div>

<script>
const state={stars:0,currentGame:null,matchDone:0,studentName:'',volume:.8,brightness:100,penColor:'#FF6B6B',penSize:12};
let audioCtx=null;
function getCtx(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx;}
function playTone(f=880,d=.15,t='sine'){
  try{const c=getCtx(),o=c.createOscillator(),g=c.createGain();
    o.type=t;o.frequency.value=f;
    g.gain.setValueAtTime(state.volume,c.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);
    o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d);
  }catch(e){}
}
function playDing(){playTone(1046,.18,'sine');setTimeout(()=>playTone(1568,.22,'sine'),90);}
function playFanfare(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>playTone(f,.25,'triangle'),i*120));}
/* 外置儿童语音（assets/greet.wav, praise.wav） */
const AUDIO={
  greet:new Audio('assets/greet.wav'),
  praise:new Audio('assets/praise.wav')
};
function playAudio(name){try{const a=AUDIO[name];if(a){a.currentTime=0;a.volume=state.volume;a.play();}}catch(e){}}
function speak(){playAudio('greet');}
/* 代币动画：完成一笔后中央飞出金币 */
const TOKEN_IMG='assets/token.png';
function showToken(){
  const t=document.createElement('div');
  t.style.cssText='position:fixed;left:50%;top:45%;transform:translate(-50%,-50%);z-index:300;pointer-events:none;';
  t.innerHTML=`<img src="${TOKEN_IMG}" style="width:90px;height:90px;object-fit:contain;filter:drop-shadow(0 4px 8px rgba(224,165,26,.4));"/>`;
  document.body.appendChild(t);
  t.animate([
    {transform:'translate(-50%,-50%) scale(.3) rotate(0deg);opacity:1'},
    {transform:'translate(-50%,-50%) scale(1.3) rotate(360deg);opacity:1;offset:.6'},
    {transform:'translate(-50%,-120%) scale(1) rotate(720deg);opacity:0'}
  ],{duration:1200,easing:'ease-out'});
  setTimeout(()=>t.remove(),1200);
}
function addStar(x,y){
  state.stars++;
  const s=document.createElement('div');s.className='float-star';
  s.innerHTML='<svg viewBox="0 0 24 24" width="48" height="48"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" fill="#FFC93C"/></svg>';
  s.style.left=(x||window.innerWidth/2-24)+'px';s.style.top=(y||window.innerHeight/2-24)+'px';
  document.body.appendChild(s);setTimeout(()=>s.remove(),1000);
}

/* 登录 */
function doLogin(){
  const u=document.getElementById('input-user').value.trim();
  const p=document.getElementById('input-pass').value.trim();
  const err=document.getElementById('login-err');
  if(u==='admin'&&p==='admin'){
    err.style.display='none';
    playDing();playAudio('greet');
    showView('view-home');
    /* 没有任何学员：强制先添加学员才能使用 */
    if(!getStudents().length)openManage(true);
    else openStudents();
  }else{
    err.style.display='block';playTone(200,.15,'sawtooth',.15);
  }
}
function logout(){
  state.studentName='';
  document.getElementById('student-box').style.visibility='hidden';
  document.getElementById('input-pass').value='';
  closeSettings();
  showView('view-login');
}

/* 学员管理 */
function getStudents(){
  try{
    const list=JSON.parse(localStorage.getItem('fineMotorStudents')||'[]');
    /* 兼容旧数据：补年级/年龄字段 */
    return list.map(s=>({name:s.name||'',grade:s.grade||'',age:s.age||''}));
  }catch(e){return [];}
}
function saveStudents(list){localStorage.setItem('fineMotorStudents',JSON.stringify(list));}
const GRADES=['学前班','一年级','二年级','三年级','四年级','五年级','六年级'];
/* 点击学生框：弹出/收起下拉菜单 */
function toggleStuMenu(e){
  if(e)e.stopPropagation();
  const m=document.getElementById('stu-menu');
  if(m.style.display==='block'){m.style.display='none';return;}
  const box=document.getElementById('student-box').getBoundingClientRect();
  m.style.left=Math.max(12,box.left)+'px';
  m.style.top=(box.bottom+10)+'px';
  m.style.display='block';
}
document.addEventListener('click',e=>{
  const m=document.getElementById('stu-menu');
  if(m&&m.style.display==='block'&&!m.contains(e.target))m.style.display='none';
});
/* ===== 选择学生：仅列出名字 ===== */
function openStudents(){
  const list=getStudents();
  /* 没有学员时直接进入强制添加流程 */
  if(!list.length){openManage(true);return;}
  document.getElementById('stu-menu').style.display='none';
  const avatarColors=['#FFB3B3','#B3D9FF','#B3FFC9','#FFE0B3','#E0B3FF','#B3F0FF','#FFD6B3','#C9FFB3'];
  let html='<div style="width:100%;max-width:1100px;margin:0 auto;padding:30px;">';
  html+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;">';
  html+='<h2 style="font-size:32px;color:var(--ink);margin:0;">选择学员</h2>';
  html+='<button onclick="closeStudents()" style="width:48px;height:48px;border-radius:50%;border:none;background:#fff;font-size:22px;cursor:pointer;box-shadow:var(--shadow-sm);color:#999;">✕</button>';
  html+='</div>';
  html+='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:20px;">';
  list.forEach((s,i)=>{
    const c=avatarColors[i%avatarColors.length];
    html+=`<div style="background:#fff;border-radius:24px;padding:26px 16px;text-align:center;box-shadow:var(--shadow-sm);cursor:pointer;transition:transform .15s;" onmouseover="this.style.transform='scale(1.04)'" onmouseout="this.style.transform=''" onclick="pickStudent(${i})">
      <div style="width:80px;height:80px;border-radius:50%;background:${c};margin:0 auto 12px;display:flex;align-items:center;justify-content:center;">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="#fff"><path d="M12 12a5 5 0 100-10 5 5 0 000 10zm0 2c-4 0-8 2-8 6v2h16v-2c0-4-4-6-8-6z"/></svg>
      </div>
      <div style="font-size:20px;font-weight:600;color:var(--ink);">${s.name}</div>
    </div>`;
  });
  if(!list.length)html+='<div style="grid-column:1/-1;background:#fff;border-radius:20px;padding:36px;text-align:center;color:#999;font-size:18px;">还没有学员，请先到「学生管理」添加</div>';
  html+='</div></div>';
  document.getElementById('students-overlay').innerHTML=html;
  document.getElementById('students-overlay').classList.add('show');
}
/* ===== 学生管理：列表 + 添加/编辑（姓名、年级、年龄） ===== */
let stuManageLocked=false;
function openManage(locked){
  stuManageLocked=!!locked;
  document.getElementById('stu-menu').style.display='none';
  const list=getStudents();
  const avatarColors=['#FFB3B3','#B3D9FF','#B3FFC9','#FFE0B3','#E0B3FF','#B3F0FF','#FFD6B3','#C9FFB3'];
  let html='<div style="width:100%;max-width:760px;margin:0 auto;padding:30px;">';
  html+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;">';
  html+='<h2 style="font-size:32px;color:var(--ink);margin:0;">学生管理</h2>';
  if(!stuManageLocked)html+='<button onclick="closeStudents()" style="width:48px;height:48px;border-radius:50%;border:none;background:#fff;font-size:22px;cursor:pointer;box-shadow:var(--shadow-sm);color:#999;">✕</button>';
  html+='</div>';
  if(stuManageLocked)html+='<div style="background:#FFF4D1;border:2px solid #FFD08A;border-radius:16px;padding:14px 18px;margin-bottom:18px;font-size:18px;color:#8A6A22;font-weight:600;">还没有学员信息，请先添加一位学员，才能开始训练</div>';
  /* 添加表单 */
  html+='<div id="stu-form" style="display:none;background:#fff;border-radius:20px;padding:22px;box-shadow:var(--shadow-sm);margin-bottom:18px;">';
  html+='<div style="font-size:19px;font-weight:700;color:var(--ink);margin-bottom:14px;" id="stu-form-title">新增学员</div>';
  html+='<div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;">';
  html+='<input type="text" id="stu-f-name" placeholder="姓名" style="flex:2;min-width:140px;padding:13px 14px;border:2px solid #FFE0B8;border-radius:12px;font-size:17px;font-family:inherit;box-sizing:border-box;">';
  html+='<select id="stu-f-grade" style="flex:2;min-width:120px;padding:13px;border:2px solid #FFE0B8;border-radius:12px;font-size:17px;font-family:inherit;cursor:pointer;outline:none;">';
  html+='<option value="">选择年级</option>'+GRADES.map(g=>`<option value="${g}">${g}</option>`).join('')+'</select>';
  html+='<input type="number" id="stu-f-age" min="2" max="20" placeholder="年龄" style="flex:1;min-width:90px;padding:13px 14px;border:2px solid #FFE0B8;border-radius:12px;font-size:17px;font-family:inherit;box-sizing:border-box;">';
  html+='</div>';
  html+='<div style="display:flex;gap:10px;margin-top:16px;">';
  html+='<button onclick="saveStuForm()" style="flex:1;padding:13px;background:var(--blue);color:#fff;border:none;border-radius:12px;font-size:17px;cursor:pointer;font-family:inherit;">保存</button>';
  html+='<button onclick="hideStuForm()" style="flex:1;padding:13px;background:#f0f0f0;border:none;border-radius:12px;font-size:17px;cursor:pointer;font-family:inherit;">取消</button>';
  html+='</div></div>';
  /* 列表 */
  html+='<div id="stu-rows">';
  list.forEach((s,i)=>{
    const c=avatarColors[i%avatarColors.length];
    html+=`<div style="display:flex;align-items:center;gap:16px;background:#fff;border-radius:18px;padding:14px 20px;margin-bottom:12px;box-shadow:var(--shadow-sm);">
      <div style="width:54px;height:54px;border-radius:50%;background:${c};flex:none;display:flex;align-items:center;justify-content:center;">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="#fff"><path d="M12 12a5 5 0 100-10 5 5 0 000 10zm0 2c-4 0-8 2-8 6v2h16v-2c0-4-4-6-8-6z"/></svg>
      </div>
      <div style="flex:1;min-width:0;">
        <div style="font-size:19px;font-weight:700;color:var(--ink);">${s.name}</div>
        <div style="font-size:15px;color:var(--ink-soft);margin-top:2px;">${s.grade||'未设年级'} · ${s.age?s.age+' 岁':'未设年龄'}</div>
      </div>
      <button onclick="showStuForm(${i})" style="padding:9px 20px;border:none;border-radius:12px;background:#EAF6FF;color:#2D84C7;font-size:16px;cursor:pointer;font-family:inherit;font-weight:600;">编辑</button>
      <button onclick="delStudent(${i})" style="padding:9px 20px;border:none;border-radius:12px;background:#FFECEC;color:#C0392B;font-size:16px;cursor:pointer;font-family:inherit;font-weight:600;">删除</button>
    </div>`;
  });
  if(!list.length)html+='<div style="background:#fff;border-radius:20px;padding:36px;text-align:center;color:#999;font-size:18px;">还没有学员，点击下方按钮添加</div>';
  html+='</div>';
  html+='<button onclick="showStuForm(-1)" style="width:100%;margin-top:8px;padding:16px;border:3px dashed #FFD08A;border-radius:18px;background:rgba(255,255,255,.6);color:#B8860B;font-size:18px;font-weight:700;cursor:pointer;font-family:inherit;">＋ 新增学员</button>';
  html+='</div>';
  document.getElementById('students-overlay').innerHTML=html;
  document.getElementById('students-overlay').classList.add('show');
  /* 强制模式：直接展开新增表单 */
  if(stuManageLocked)showStuForm(-1);
}
let stuEditIdx=-1;
function showStuForm(i){
  stuEditIdx=i;
  const list=getStudents();
  document.getElementById('stu-form').style.display='block';
  document.getElementById('stu-form-title').textContent=i<0?'新增学员':'编辑学员信息';
  document.getElementById('stu-f-name').value=i<0?'':list[i].name;
  document.getElementById('stu-f-grade').value=i<0?'':list[i].grade;
  document.getElementById('stu-f-age').value=i<0?'':list[i].age;
  document.getElementById('stu-form').scrollIntoView({behavior:'smooth',block:'center'});
}
function hideStuForm(){document.getElementById('stu-form').style.display='none';}
function saveStuForm(){
  const name=document.getElementById('stu-f-name').value.trim();
  if(!name){alert('请输入学员姓名');return;}
  const grade=document.getElementById('stu-f-grade').value;
  const ageRaw=document.getElementById('stu-f-age').value;
  const age=ageRaw?Math.max(2,Math.min(20,parseInt(ageRaw,10))):'';
  const list=getStudents();
  if(stuEditIdx<0)list.push({name,grade,age});
  else{
    /* 正在使用的学员改名时同步顶栏 */
    if(state.studentName&&state.studentName===list[stuEditIdx].name){
      state.studentName=name;
      document.getElementById('student-name').textContent=name;
    }
    list[stuEditIdx]={name,grade,age};
  }
  saveStudents(list);
  playTone(600,.1,'sine',.12);
  hideStuForm();
  /* 强制添加流程：保存后自动选中第一位学员并关闭 */
  if(stuManageLocked){
    stuManageLocked=false;
    if(!state.studentName&&list.length){pickStudent(0);return;}
  }
  openManage();
}
function closeStudents(){document.getElementById('students-overlay').classList.remove('show');}
function delStudent(i){
  if(!confirm('确定删除该学员？'))return;
  const list=getStudents();list.splice(i,1);saveStudents(list);openManage();
}
function pickStudent(i){
  const list=getStudents();const s=list[i];
  state.studentName=s.name;
  document.getElementById('student-name').textContent=s.name;
  document.getElementById('student-box').style.visibility='visible';
  closeStudents();playDing();playAudio('greet');
}

/* 设置 */
function openSettings(){document.getElementById('settings-overlay').classList.add('show');}
function closeSettings(){document.getElementById('settings-overlay').classList.remove('show');}
function onVol(v){state.volume=v/100;document.getElementById('vol-val').textContent=v+'%';playTone(600,.1,'sine');}
function onBright(v){state.brightness=v;document.getElementById('bright-val').textContent=v+'%';document.body.style.filter=`brightness(${v}%)`;}

function showView(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(id).classList.add('active');
  const b=document.querySelector('.brand');if(b)b.style.visibility=(id==='view-home'||id==='view-login')?'visible':'hidden';}
/* 计时器 */
let timerSec=0,timerInt=null;
function startTimer(){stopTimer();timerSec=0;document.getElementById('timer').textContent='00:00';
  timerInt=setInterval(()=>{timerSec++;const m=String(Math.floor(timerSec/60)).padStart(2,'0');
    const s=String(timerSec%60).padStart(2,'0');document.getElementById('timer').textContent=m+':'+s;},1000);}
function stopTimer(){if(timerInt){clearInterval(timerInt);timerInt=null;}}

/* ============ 语音 / 提示 / 庆祝动效 ============ */
function speakChar(text){
  try{
    if(!window.speechSynthesis)return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='zh-CN';u.rate=.8;u.pitch=1.1;
    speechSynthesis.speak(u);
  }catch(e){}
}
function showTip(text){
  const t=document.createElement('div');
  t.textContent=text;
  t.style.cssText='position:fixed;left:50%;top:30%;transform:translate(-50%,-50%);background:#FF6B6B;color:#fff;padding:12px 26px;border-radius:30px;font-size:20px;z-index:200;pointer-events:none;box-shadow:0 6px 16px rgba(0,0,0,.25);';
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),1300);
}
function randomCelebrate(){
  const fx=['thumb','stars','fireworks'][Math.floor(Math.random()*3)];
  if(fx==='thumb'){
    const t=document.createElement('div');
    t.style.cssText='position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:300;pointer-events:none;';
    t.innerHTML='<svg width="110" height="110" viewBox="0 0 24 24" fill="#FFC93C"><path d="M2 20h2V10H2v10zm20-10h-6V4a1.66 1.66 0 00-1.67-1.67c-.51 0-1.03.25-1.33.67L8 10H4v12h14a2 2 0 002-2v-8z"/></svg>';
    document.body.appendChild(t);
    t.animate([{transform:'translate(-50%,-50%) scale(.3)',opacity:1},{transform:'translate(-50%,-50%) scale(1.25)',opacity:1,offset:.5},{transform:'translate(-50%,-150%) scale(1)',opacity:0}],{duration:1000,easing:'ease-out'});

  }else if(fx==='stars'){
    for(let i=0;i<6;i++){
      const s=document.createElement('div');s.className='float-star';
      s.innerHTML='<svg viewBox="0 0 24 24" width="46" height="46"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" fill="#FFC93C"/></svg>';
      s.style.left=(window.innerWidth/2-24+(Math.random()-0.5)*240)+'px';
      s.style.top=(window.innerHeight/2-24+(Math.random()-0.5)*120)+'px';
      document.body.appendChild(s);setTimeout(()=>s.remove(),1000);
    }
  }else{

    for(let i=0;i<10;i++){

      s.style.cssText=`position:fixed;left:${30+Math.random()*40}%;top:${28+Math.random()*30}%;width:12px;height:12px;border-radius:50%;background:${colors[i%colors.length]};z-index:300;pointer-events:none;`;
      document.body.appendChild(s);
      const a=Math.random()*Math.PI*2,d=80+Math.random()*70;
      s.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px) scale(0)`,opacity:0}],{duration:800,easing:'ease-out'});
      setTimeout(()=>s.remove(),800);

function addStar(x,y){
  state.stars++;
  const s=document.createElement('div');s.className='float-star';
  s.innerHTML='<svg viewBox="0 0 24 24" width="44" height="44"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" fill="#FFC93C"/></svg>';
  s.style.left=(x||window.innerWidth/2-22)+'px';s.style.top=(y||window.innerHeight/2-22)+'px';
  document.body.appendChild(s);setTimeout(()=>s.remove(),1000);
}
function completeGame(title,desc,score,silent){
  stopTimer();
  // 玩一玩保存训练记录（画一画改由 finishPaintCourse 汇总保存）
  if(state.currentGame==='match'){
    const moduleName='玩一玩';
    let items=[];
    const t=document.getElementById('play-title');if(t)items=[t.textContent];
    const record={
      id:Date.now(),date:new Date().toLocaleString('zh-CN'),
      student:state.studentName||'学生',module:moduleName,mode:'课堂练习',
      items:items,duration:timerSec,note:'',img:'',
      gameId:(typeof ROUND!=='undefined')?ROUND.game:null,
      gameStars:(typeof ROUND!=='undefined')?getBest()[ROUND.game]||0:0,
      refReport:(typeof lastReportId!=='undefined')?lastReportId:null,
      score:(typeof score==='number')?score:Math.min(100,70+items.length*3)
    };
    const logs=getLogs();logs.unshift(record);saveLogs(logs);
  }
  if(silent)return;
  document.getElementById('done-title').textContent=title;
  document.getElementById('done-desc').textContent=desc;
  document.getElementById('done-overlay').classList.add('show');
}

/* ============ 写一写：字库数据 ============ */
const WRITE_DATA={
  stroke:[
    {key:'horizontal',label:'横'},{key:'vertical',label:'竖'},{key:'circle',label:'圆'},
    {key:'diagonal',label:'斜'},{key:'wave',label:'波'},{key:'cross',label:'十'}
  ],
  radical:['亻','氵','木','口','日','扌','艹','土','女','火','讠','忄','纟','辶','宀','冫','刂','力','又','冖','勹','匚','冂','阝'].map((c,i)=>({key:'r'+i,label:c})),
  char:'人 口 手 日 月 水 火 山 石 田 土 大 小 上 下 木 目 耳 足 牛 羊 云 雨 风 花 草 鸟 虫 鱼 爸 妈 我 你 他 老 师 学 校 生 工'.split(' ').map(c=>({key:c,label:c}))
};
const CHAR_GLYPH={};
WRITE_DATA.radical.forEach(r=>CHAR_GLYPH[r.key]=r.label);
WRITE_DATA.char.forEach(c=>CHAR_GLYPH[c.key]=c.label);

let writeMode='free';
let writeState={};
let writeWorks=[];   // 本次写一写完成的所有字 {name,img}
let aiQueue=[],aiIndex=0,aiDoneList=[];
let currentCat='stroke',currentItem='horizontal';
let teacherSelected={};

function buildStrokePath(type,W,H){
  const cx=W/2,cy=H/2,pts=[];
  if(type==='horizontal'){for(let i=0;i<=30;i++){const t=i/30;pts.push({x:W*.25+W*.5*t,y:cy});}}
  else if(type==='vertical'){for(let i=0;i<=30;i++){const t=i/30;pts.push({x:cx,y:H*.2+H*.6*t});}}
  else if(type==='circle'){const r=Math.min(W,H)*.25;for(let i=0;i<=40;i++){const a=-Math.PI/2+(i/40)*Math.PI*2;pts.push({x:cx+r*Math.cos(a),y:cy+r*Math.sin(a)});}}
  else if(type==='diagonal'){for(let i=0;i<=30;i++){const t=i/30;pts.push({x:W*.25+W*.5*t,y:H*.7-H*.4*t});}}
  else if(type==='wave'){for(let i=0;i<=40;i++){const t=i/40;pts.push({x:W*.2+W*.6*t,y:cy+Math.sin(t*Math.PI*3)*H*.12});}}
  else if(type==='cross'){for(let i=0;i<=20;i++){const t=i/20;pts.push({x:W*.25+W*.5*t,y:cy});}for(let i=1;i<=20;i++){const t=i/20;pts.push({x:cx,y:cy+H*.4*t});}}
  return pts;
}

/* 画一只伸出食指的卡通小手，指尖在(tipX,tipY)，手指指向 angle（弧度） */
function drawHand(c,tipX,tipY,angle,s){
  s=s||1;
  c.save();
  c.translate(tipX,tipY);
  c.rotate(angle);
  c.scale(s,s);
  const skin='#FFD9B3',edge='#E39A55';
  c.lineJoin='round';c.lineCap='round';
  // 手形（食指朝右，指尖在0,0）
  const h=new Path2D();
  h.moveTo(0,0);
  // 食指上缘
  h.quadraticCurveTo(-3,-7,-8,-7);
  h.lineTo(-26,-7);
  // 蜷起的三根手指（拳顶两个小鼓包）
  h.quadraticCurveTo(-27,-14,-34,-13);
  h.quadraticCurveTo(-39,-18,-45,-13);
  h.quadraticCurveTo(-53,-16,-58,-8);
  // 手掌外侧
  h.quadraticCurveTo(-66,2,-58,12);
  // 手掌下缘
  h.quadraticCurveTo(-52,20,-44,18);
  // 拇指（向下突出）
  h.quadraticCurveTo(-52,26,-46,33);
  h.quadraticCurveTo(-38,37,-32,30);
  h.quadraticCurveTo(-28,22,-30,14);
  // 食指下缘
  h.lineTo(-8,7);
  h.quadraticCurveTo(-3,7,0,0);
  h.closePath();
  c.fillStyle=skin;c.fill(h);c.strokeStyle=edge;c.lineWidth=2.5;c.stroke(h);
  // 拇指缝
  c.strokeStyle=edge;c.lineWidth=2;
  c.beginPath();c.moveTo(-44,18);c.quadraticCurveTo(-40,12,-34,11);c.stroke();
  // 拳头皱纹
  c.beginPath();c.moveTo(-50,-2);c.quadraticCurveTo(-46,2,-44,7);c.stroke();
  // 食指指尖（指甲盖）
  c.fillStyle='#FFEAD2';
  c.beginPath();c.ellipse(-4,0,5,4.5,0,0,Math.PI*2);c.fill();
  c.restore();
}

function initWrite(){
  const canvas=document.getElementById('write-canvas'),area=canvas.parentElement;
  const dpr=window.devicePixelRatio||1,W=area.clientWidth,H=area.clientHeight;
  canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';
  const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);
  writeState={ctx,W,H,lastX:0,lastY:0,done:false,mode:currentCat,painted:new Set(),undoStack:[],warnTime:0,path:[],hits:[]};
  ctx.fillStyle='#FFFEF8';ctx.fillRect(0,0,W,H);
  // 田字格
  ctx.strokeStyle='#FFD9D9';ctx.lineWidth=2;
  ctx.strokeRect(W*.15,H*.1,W*.7,H*.8);
  ctx.beginPath();ctx.moveTo(W*.5,H*.1);ctx.lineTo(W*.5,H*.9);
  ctx.moveTo(W*.15,H*.5);ctx.lineTo(W*.85,H*.5);ctx.stroke();
  const path=buildStrokePath(currentItem,W,H);
  writeState.path=path;
  writeState.hits=new Array(path.length).fill(false);
  if(currentCat==='stroke'){
    // 黄色虚线引导
    ctx.strokeStyle='#FFD54F';ctx.lineWidth=10;ctx.lineCap='round';ctx.setLineDash([12,10]);
    ctx.beginPath();path.forEach((p,i)=>{if(i===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y);});ctx.stroke();
    ctx.setLineDash([]);
  }else{
    // 大字浅灰底模
    const glyph=CHAR_GLYPH[currentItem]||'';
    ctx.fillStyle='#F0E0D8';
    ctx.font=`${Math.min(W,H)*.6}px 'ZCOOL KuaiLe','Noto Sans SC',sans-serif`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(glyph,W/2,H/2);
  }
  bindDraw(canvas,(x,y)=>{
    const{path,hits,lastX,lastY,painted,mode}=writeState;
    ctx.strokeStyle=state.penColor;ctx.lineWidth=state.penSize;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.beginPath();ctx.moveTo(lastX,lastY);ctx.lineTo(x,y);ctx.stroke();
    writeState.lastX=x;writeState.lastY=y;
    const checkDone=(name)=>{
      aiDoneList.push(name);
      // 保存这一个字的作品（清屏跳字前截图）
      try{writeWorks.push({name:name,img:shrinkCanvas(canvas)});}catch(e){}
      playDing();playAudio('praise');randomCelebrate();
      if(aiIndex<aiQueue.length-1){
        aiIndex++;
        const next=aiQueue[aiIndex];
        currentCat=next.cat||currentCat;currentItem=next.key;
        document.querySelectorAll('.cat-tab').forEach(t=>t.classList.toggle('active',t.dataset.cat===currentCat));
        renderWriteList();
        setTimeout(()=>initWrite(),600);
      }else{
        if(writeMode==='free'){showTip('全部练习完成！可继续选字练习');}
        else{finishAiCourse();}
      }
    };
    if(mode==='stroke'){
      let minD=999;
      path.forEach((p,i)=>{const d=Math.hypot(p.x-x,p.y-y);if(d<40)hits[i]=true;if(d<minD)minD=d;});
      if(minD>60&&!writeState.done&&(!writeState.warnTime||Date.now()-writeState.warnTime>2000)){
        writeState.warnTime=Date.now();speakChar('再靠近一点');
      }
      if(!writeState.done&&hits.filter(Boolean).length/hits.length>=.9){
        writeState.done=true;
        checkDone(WRITE_DATA.stroke.find(s=>s.key===currentItem).label);
      }
    }else{
      // 偏旁/文字：在字格中心区域涂色比例
      const gx=Math.floor((x-W*.15)/24),gy=Math.floor((y-H*.1)/24);
      if(gx>=0&&gy>=0&&gx<W/24&&gy<H/24)painted.add(gx+','+gy);
      if(painted.size>60&&!writeState.done){
        writeState.done=true;
        checkDone(CHAR_GLYPH[currentItem]);
      }
    }
  });
}
function bindDraw(canvas,onMove){
  function gp(e){const r=canvas.getBoundingClientRect();
    if(e.touches&&e.touches[0])return{x:e.touches[0].clientX-r.left,y:e.touches[0].clientY-r.top};
    return{x:e.clientX-r.left,y:e.clientY-r.top};}
  let p=false;
  function down(e){p=true;const q=gp(e);
    if(canvas.id==='write-canvas'){
      writeState.lastX=q.x;writeState.lastY=q.y;
      try{writeState.undoStack.push(canvas.toDataURL());if(writeState.undoStack.length>20)writeState.undoStack.shift();}catch(err){}
    }
    onMove(q.x,q.y);e.preventDefault();}
  function move(e){if(!p)return;onMove(gp(e).x,gp(e).y);e.preventDefault();}
  function up(){p=false;}
  canvas.onmousedown=e=>{down(e);canvas.onmousemove=ev=>move(ev);};
  canvas.onmouseup=()=>{canvas.onmousemove=null;up();};
  canvas.ontouchstart=e=>down(e);canvas.ontouchmove=e=>move(e);canvas.ontouchend=()=>up();
}

function startGame(name){
  /* 未选择学员不允许使用任何训练模块 */
  if(!state.studentName){playTone(300,.14,'sawtooth',.15);openStudents();return;}
  state.currentGame=name;
  document.getElementById('btn-back').style.display='flex';
  playTone(600,.1,'sine');
  if(name==='write'){
    showView('view-write');startTimer();
    // 默认自由练习，初始化队列
    writeMode='free';aiIndex=0;aiDoneList=[];writeWorks=[];
    document.querySelectorAll('.mode-btn').forEach(b=>b.classList.toggle('active',b.dataset.mode==='free'));
    aiQueue=[];
    WRITE_DATA.stroke.forEach(s=>aiQueue.push({key:s.key,cat:'stroke'}));
    WRITE_DATA.radical.forEach(s=>aiQueue.push({key:s.key,cat:'radical'}));
    WRITE_DATA.char.forEach(s=>aiQueue.push({key:s.key,cat:'char'}));
    currentCat='stroke';currentItem=aiQueue[0].key;
    document.querySelectorAll('.cat-tab').forEach(t=>t.classList.toggle('active',t.dataset.cat==='stroke'));
    renderWriteList();
    requestAnimationFrame(()=>initWrite());
  }
  if(name==='paint'){
    paintWorks=[];paintSeq=[];paintCat='fruit';paintItem='apple';
    document.querySelectorAll('#paint-cat-tabs .cat-tab').forEach(t=>t.classList.toggle('active',t.dataset.pcat==='fruit'));
    showView('view-paint');startTimer();renderPaintItems();requestAnimationFrame(()=>initPaint());
  }
  if(name==='match'){state.matchDone=0;showView('view-match');startTimer();backToMenu();}
}
function goHome(){
  stopTimer();
  // 如果已经在报告页或记录页，直接返回首页
  if(document.getElementById('view-report').classList.contains('active')||
     document.getElementById('view-greport').classList.contains('active')||
     document.getElementById('view-logs').classList.contains('active')){
    document.getElementById('done-overlay').classList.remove('show');
    document.getElementById('btn-back').style.display='none';
    state.currentGame=null;showView('view-home');
    return;
  }
  // 自由练习退出时结算
  if(state.currentGame==='write'&&writeMode==='free'&&aiDoneList.length>0){
    finishAiCourse();
    return;
  }
  // 画一画退出时汇总所有作品出报告
  if(state.currentGame==='paint'&&paintWorks.length>0){
    finishPaintCourse();
    return;
  }
  document.getElementById('done-overlay').classList.remove('show');
  document.getElementById('btn-back').style.display='none';
  state.currentGame=null;showView('view-home');
}
function retryGame(){
  const g=state.currentGame;
  document.getElementById('done-overlay').classList.remove('show');
  if(g==='write'){initWrite();}
  else if(g==='paint'){initPaint();}
  else if(g==='match'){
    const t=document.getElementById('play-title').textContent;
    const gm=PLAY_GAMES.find(x=>x.name===t);
    if(gm)startPlayGame(gm.id);else backToMenu();
  }
}
function nextGame(){
  const g=state.currentGame;
  document.getElementById('done-overlay').classList.remove('show');
  if(g==='match'){backToMenu();}
  else goHome();
}

/* 缩略截图（jpeg，控制localStorage体积） */
function shrinkCanvas(src,size){
  try{
    size=size||220;
    const t=document.createElement('canvas');t.width=size;t.height=size;
    const tc=t.getContext('2d');tc.fillStyle='#FFFDF5';tc.fillRect(0,0,size,size);
    const ar=src.width/src.height;
    let dw=size,dh=size;
    if(ar>1){dh=size/ar;}else{dw=size*ar;}
    tc.drawImage(src,(size-dw)/2,(size-dh)/2,dw,dh);
    return t.toDataURL('image/jpeg',0.72);
  }catch(e){return '';}
}

/* 参考图叠色：在 clip 裁剪内依次绘制 PAINT_MULTI 色块 */
function applyPaintMulti(ctx,key,shape,cx,cy,R){
  const list=PAINT_MULTI[key];
  if(!list||!list.length)return;
  const X=v=>cx+R*v,Y=v=>cy+R*v;
  ctx.save();ctx.clip(shape.clip);
  list.forEach(o=>{
    ctx.fillStyle=o[o.length-1];
    ctx.beginPath();
    if(o[0]==='c')ctx.arc(X(o[1]),Y(o[2]),R*o[3],0,Math.PI*2);
    else if(o[0]==='e'){ctx.ellipse(X(o[1]),Y(o[2]),R*o[3],R*o[4],o[5],0,Math.PI*2);}
    else if(o[0]==='r')ctx.rect(X(o[1]),Y(o[2]),R*o[3],R*o[4]);
    ctx.fill();
  });
  ctx.restore();
}

/* ================================================================
   涂色图案库 v3：可爱卡通线稿（clip=可填色轮廓 detail=特征细节）
================================================================ */
function drawItemShape(ctx,key,cx,cy,R){
  const X=v=>cx+R*v, Y=v=>cy+R*v;
  const clip=new Path2D();
  const circle=(p,cxv,cyv,rv)=>{p.moveTo(X(cxv+rv),Y(cyv));p.arc(X(cxv),Y(cyv),R*rv,0,Math.PI*2);};
  const ell=(p,cxv,cyv,rx,ry,rot)=>{
    /* 先 moveTo 到椭圆起点，避免 ellipse() 从上一子路径终点自动连线 */
    const rt=rot||0;
    p.moveTo(X(cxv)+R*rx*Math.cos(rt),Y(cyv)+R*rx*Math.sin(rt));
    p.ellipse(X(cxv),Y(cyv),R*rx,R*ry,rt,0,Math.PI*2);
  };
  /* ---------- 水果 ---------- */
  if(key==='apple'){
    clip.moveTo(X(0),Y(-0.52));
    clip.bezierCurveTo(X(-0.14),Y(-0.8),X(-0.44),Y(-0.92),X(-0.64),Y(-0.8));
    clip.bezierCurveTo(X(-0.96),Y(-0.6),X(-1.04),Y(-0.16),X(-0.92),Y(0.26));
    clip.bezierCurveTo(X(-0.82),Y(0.66),X(-0.48),Y(0.96),X(-0.16),Y(0.96));
    clip.bezierCurveTo(X(-0.05),Y(0.97),X(0.05),Y(0.97),X(0.16),Y(0.96));
    clip.bezierCurveTo(X(0.48),Y(0.96),X(0.82),Y(0.66),X(0.92),Y(0.26));
    clip.bezierCurveTo(X(1.04),Y(-0.16),X(0.96),Y(-0.6),X(0.64),Y(-0.8));
    clip.bezierCurveTo(X(0.44),Y(-0.92),X(0.14),Y(-0.8),X(0),Y(-0.52));
    clip.closePath();
    // 果柄
    clip.moveTo(X(-0.04),Y(-0.6));
    clip.bezierCurveTo(X(-0.07),Y(-0.78),X(-0.07),Y(-0.95),X(-0.05),Y(-1.1));
    clip.lineTo(X(0.07),Y(-1.08));
    clip.bezierCurveTo(X(0.05),Y(-0.94),X(0.05),Y(-0.78),X(0.07),Y(-0.62));
    clip.closePath();
    // 叶子
    clip.moveTo(X(0.12),Y(-0.86));
    clip.bezierCurveTo(X(0.2),Y(-1.16),X(0.62),Y(-1.22),X(0.72),Y(-0.98));
    clip.bezierCurveTo(X(0.76),Y(-0.74),X(0.4),Y(-0.62),X(0.12),Y(-0.86));
    clip.closePath();
  }else if(key==='banana'){
    clip.moveTo(X(-1.02),Y(-0.34));
    clip.bezierCurveTo(X(-0.74),Y(0.95),X(0.55),Y(1.0),X(1.06),Y(0.1));
    clip.bezierCurveTo(X(1.12),Y(-0.02),X(1.08),Y(-0.14),X(0.98),Y(-0.2));
    clip.bezierCurveTo(X(0.62),Y(0.55),X(-0.5),Y(0.6),X(-0.9),Y(-0.44));
    clip.bezierCurveTo(X(-0.99),Y(-0.54),X(-1.06),Y(-0.44),X(-1.02),Y(-0.34));
    clip.closePath();
  }else if(key==='grape'){
    [[-0.33,-0.34],[0.0,-0.38],[0.33,-0.34],
     [-0.5,0.02],[-0.17,0.04],[0.17,0.04],[0.5,0.02],
     [-0.33,0.38],[0,0.4],[0.33,0.38],
     [-0.17,0.72],[0.17,0.72]].forEach(p=>circle(clip,p[0],p[1],0.19));
    // 果柄
    clip.moveTo(X(-0.03),Y(-0.7));
    clip.lineTo(X(-0.03),Y(-1.06));clip.lineTo(X(0.08),Y(-1.06));clip.lineTo(X(0.08),Y(-0.66));
    clip.closePath();
  }else if(key==='strawberry'){
    clip.moveTo(X(-0.58),Y(-0.42));
    clip.bezierCurveTo(X(-0.82),Y(0.16),X(-0.42),Y(0.72),X(0),Y(0.96));
    clip.bezierCurveTo(X(0.42),Y(0.72),X(0.82),Y(0.16),X(0.58),Y(-0.42));
    clip.bezierCurveTo(X(0.32),Y(-0.54),X(-0.32),Y(-0.54),X(-0.58),Y(-0.42));
    clip.closePath();
    // 蒂叶（三片）
    clip.moveTo(X(-0.55),Y(-0.44));
    clip.quadraticCurveTo(X(-0.5),Y(-0.78),X(-0.22),Y(-0.62));
    clip.quadraticCurveTo(X(-0.14),Y(-0.84),X(0),Y(-0.62));
    clip.quadraticCurveTo(X(0.14),Y(-0.84),X(0.22),Y(-0.62));

    clip.quadraticCurveTo(X(0),Y(-0.24),X(-0.55),Y(-0.44));

  }else if(key==='orange'){
    circle(clip,0,0.08,0.88);
    ell(clip,0.3,-0.74,0.3,0.15,-0.5);
    clip.moveTo(X(-0.02),Y(-0.86));clip.lineTo(X(-0.02),Y(-0.98));clip.lineTo(X(0.06),Y(-0.98));clip.lineTo(X(0.06),Y(-0.84));
    clip.closePath();
  }
  /* ---------- 蔬菜 ---------- */
  else if(key==='carrot'){
    clip.moveTo(X(-0.34),Y(-0.5));
    clip.quadraticCurveTo(X(-0.44),Y(-0.55),X(-0.4),Y(-0.43));
    clip.quadraticCurveTo(X(-0.22),Y(0.28),X(-0.05),Y(0.9));
    clip.quadraticCurveTo(X(0),Y(1.02),X(0.05),Y(0.9));

function initPaint(){
  const canvas=document.getElementById('paint-canvas'),area=canvas.parentElement;
  const dpr=window.devicePixelRatio||1,W=area.clientWidth,H=area.clientHeight;
  canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';
  const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);
  const cx=W/2,cy=H/2,R=Math.min(W,H)*0.26;
  const shape=drawItemShape(ctx,paintItem,cx,cy,R);
  const clip=shape.clip;
  // 离屏涂色层（用户的涂抹只画在这一层，并用 clip 限制在轮廓内）
  const fillCanvas=document.createElement('canvas');
  fillCanvas.width=W*dpr;fillCanvas.height=H*dpr;
  const fctx=fillCanvas.getContext('2d');fctx.scale(dpr,dpr);
  // 覆盖率采样点（只在轮廓内部）
  const samplePts=[];
  const step=Math.max(10,R*0.11);
  for(let yy=cy-R-step;yy<=cy+R+step;yy+=step){
    for(let xx=cx-R-step;xx<=cx+R+step;xx+=step){
      if(ctx.isPointInPath(clip,xx,yy))samplePts.push([xx,yy]);
    }
  }
  paintState={ctx,fctx,fillCanvas,W,H,dpr,done:false,clip,shape,cx,cy,R,lastCheck:0,lastX:0,lastY:0};
  renderPaint();
  // 参考图（彩色示例 + 名称）
  const rc=document.getElementById('paint-ref-canvas');
  const rctx=rc.getContext('2d');
  rctx.clearRect(0,0,100,100);
  const rs=drawItemShape(rctx,paintItem,50,52,34);
  rctx.fillStyle=PAINT_REF[paintItem]||'#FF6B6B';
  rctx.fill(rs.clip);
  applyPaintMulti(rctx,paintItem,rs,50,52,34);
  rctx.strokeStyle='#C68B4D';rctx.lineWidth=2.4;rctx.lineJoin='round';rctx.stroke(rs.clip);
  rs.detail(rctx,true);
  const rn=document.getElementById('paint-ref-name');
  if(rn)rn.textContent=PAINT_DATA[paintCat].items[paintItem]||'参考图';
  function renderPaint(){
    ctx.fillStyle='#FFFDF5';ctx.fillRect(0,0,W,H);
    ctx.drawImage(fillCanvas,0,0,W,H);
    ctx.strokeStyle='#C68B4D';ctx.lineWidth=4;ctx.lineJoin='round';ctx.lineCap='round';ctx.stroke(clip);
    shape.detail(ctx,paintState.done);
  }
  paintState.render=renderPaint;
  function stamp(x,y){
    if(paintState.done)return;
    fctx.save();
    fctx.clip(clip);
    fctx.strokeStyle=paintBrushColor;fctx.fillStyle=paintBrushColor;
    fctx.lineWidth=paintBrushSize;fctx.lineCap='round';fctx.lineJoin='round';
    const lx=paintState.lastX,ly=paintState.lastY;
    if(lx||ly){fctx.beginPath();fctx.moveTo(lx,ly);fctx.lineTo(x,y);fctx.stroke();}
    fctx.beginPath();fctx.arc(x,y,paintBrushSize/2,0,Math.PI*2);fctx.fill();
    fctx.restore();
    paintState.lastX=x;paintState.lastY=y;
    renderPaint();
    const now=Date.now();
    if(now-paintState.lastCheck>220){paintState.lastCheck=now;checkPaintCoverage();}
  }
  function checkPaintCoverage(){
    if(paintState.done||!samplePts.length)return;
    let data;
    try{data=fctx.getImageData(0,0,W*dpr,H*dpr).data;}catch(e){return;}
    let covered=0;
    for(const p of samplePts){
      const px=Math.floor(p[0]*dpr),py=Math.floor(p[1]*dpr);
      if(data[(py*W*dpr+px)*4+3]>24)covered++;
    }
    if(covered/samplePts.length>=0.9)completePaintItem();
  }
  let drawing=false;
  function gp(e){const r=canvas.getBoundingClientRect();
    if(e.touches&&e.touches[0])return{x:e.touches[0].clientX-r.left,y:e.touches[0].clientY-r.top};
    return{x:e.clientX-r.left,y:e.clientY-r.top};}
  canvas.onmousedown=e=>{drawing=true;const q=gp(e);paintState.lastX=q.x;paintState.lastY=q.y;stamp(q.x,q.y);};
  canvas.onmousemove=e=>{if(drawing)stamp(gp(e).x,gp(e).y);};
  canvas.onmouseup=()=>{drawing=false;paintState.lastX=0;paintState.lastY=0;};
  canvas.ontouchstart=e=>{drawing=true;const q=gp(e);paintState.lastX=q.x;paintState.lastY=q.y;stamp(q.x,q.y);e.preventDefault();};
  canvas.ontouchmove=e=>{if(drawing)stamp(gp(e).x,gp(e).y);e.preventDefault();};
  canvas.ontouchend=()=>{drawing=false;paintState.lastX=0;paintState.lastY=0;};
}
/* 一个物品涂满90%：保存作品、奖励、自动进入下一个 */
function completePaintItem(){
  const ps=paintState;
  if(!ps||ps.done)return;
  ps.done=true;
  ps.render();
  const name=PAINT_DATA[paintCat].items[paintItem];
  const img=shrinkCanvas(ps.fillCanvas?mergePaintCanvas(ps):document.getElementById('paint-canvas'));
  paintWorks.push({name:name,img:img});
  playDing();playAudio('praise');randomCelebrate();
  try{sessionStorage.setItem('lastPaintImg',img);}catch(e){}
  showTip(name+' 涂好啦！');
  setTimeout(nextPaintItem,1500);
}
/* 把涂色层+线稿合成成一张图用于保存 */
function mergePaintCanvas(ps){
  const out=document.createElement('canvas');
  out.width=ps.W*ps.dpr;out.height=ps.H*ps.dpr;
  const c=out.getContext('2d');c.scale(ps.dpr,ps.dpr);
  c.fillStyle='#FFFDF5';c.fillRect(0,0,ps.W,ps.H);
  c.drawImage(ps.fillCanvas,0,0,ps.W,ps.H);

function flyTo(fromEl,toEl,dur,scaleEnd){
